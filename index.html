<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>EMS 救援助理</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d9534f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        /* 手機優先 CSS - 針對救援場景優化按鈕大小 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4; margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh;
        }
        .header {
            background: #d9534f; /* 緊急救援紅色 */
            color: white; padding: 15px; text-align: center;
            font-size: 1.3rem; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #chatbox { 
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth; background-color: white;
        }
        .message { 
            max-width: 85%; padding: 12px 18px; border-radius: 20px; line-height: 1.5; font-size: 18px; /* 字體加大易讀 */
            word-wrap: break-word;
        }
        .user { align-self: flex-end; background-color: #007bff; color: white; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background-color: #e9ecef; color: #333; border-bottom-left-radius: 4px; border: 1px solid #ddd; }
        .controls {
            padding: 20px; background: white; border-top: 1px solid #ddd;
            display: flex; flex-direction: column; align-items: center;
        }
        #startButton { 
            width: 100%; height: 80px; /* 超大按鈕 */
            font-size: 24px; font-weight: bold;
            background-color: #28a745; color: white; border: none; border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        #startButton:active { transform: scale(0.98); background-color: #218838; }
        #startButton.listening { background-color: #dc3545; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        
        #status { margin-top: 10px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">🚑 EMS 救援助理</div>
    <div id="chatbox">
        <div class="message bot">請說出您遇到的緊急狀況，我會根據流程提供指引。</div>
    </div>
    <div class="controls">
        <button id="startButton">🎤 按下說話</button>
        <span id="status">準備就緒</span>
    </div>

    <script>
        // ============================================================
        // ⚠️ 必填 1：請填入您的 API Key
        // ============================================================
        const GEMINI_API_KEY = "AIzaSyC49kdKTdWAQM4DI04J2wYtsvjfCM5GM"; 

        // ============================================================
        // ⚠️ 必填 2：請將您的【院前緊急救援流程 PDF】文字全部貼在下面反引號中間
        // ============================================================
        const SYSTEM_INSTRUCTION = `你是一個助理。`;

        // ============================================================
        // AI 參數設定 (已優化：反應快、回答短)
        // ============================================================
        const GENERATION_CONFIG = {
            temperature: 0.4,       // 較低的創意度，確保遵守 SOP
            maxOutputTokens: 150,   // 強制簡短回答 (約 50-100 字)
        };

        // --- 核心邏輯 (不需要修改) ---
        
        const chatbox = document.getElementById('chatbox');
        const startButton = document.getElementById('startButton');
        const statusDisplay = document.getElementById('status');
        let recognition;
        let synth = window.speechSynthesis;
        let ttsInitialized = false;

        function appendMessage(sender, text) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        // 初始化語音辨識
        function initRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                alert("⚠️ 您的瀏覽器不支援語音功能，請使用 Chrome (Android) 或 Safari (iOS)。");
                return;
            }
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                statusDisplay.innerText = "👂 正在聆聽...";
                startButton.classList.add('listening');
                startButton.innerText = "🛑 聆聽中...";
            };

            recognition.onend = () => {
                statusDisplay.innerText = "準備就緒";
                startButton.classList.remove('listening');
                startButton.innerText = "🎤 按下說話";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                appendMessage('user', transcript);
                callGemini(transcript);
            };

            recognition.onerror = (event) => {
                console.error(event.error);
                statusDisplay.innerText = "❌ 錯誤: " + event.error;
                startButton.classList.remove('listening');
                startButton.innerText = "🎤 按下說話";
            };
        }

        // 呼叫 Gemini API
        async function callGemini(userText) {
            statusDisplay.innerText = "⚡ 分析中...";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: userText }] }],
                        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
                        generationConfig: GENERATION_CONFIG
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                
                const botText = data.candidates?.[0]?.content?.parts?.[0]?.text || "無法識別，請重複。";
                appendMessage('bot', botText);
                speak(botText);
                statusDisplay.innerText = "✅ 完成";

            } catch (error) {
                console.error(error);
                appendMessage('bot', "系統連線錯誤。");
                statusDisplay.innerText = "❌ 連線失敗";
            }
        }

        // 語音合成 (TTS)
        function speak(text) {
            if (synth.speaking) synth.cancel();
            
            if (!ttsInitialized) {
                synth.speak(new SpeechSynthesisUtterance(" "));
                ttsInitialized = true;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.1; // 稍微講快一點 (緊急情況)
            synth.speak(utterance);
        }

        startButton.addEventListener('click', () => {
            if (synth.speaking) synth.cancel();
            if (!ttsInitialized) speak(" ");
            recognition.start();
        });

        initRecognition();
    </script>
</body>
</html>
