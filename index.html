前言 
依據 
依緊急醫療救護法第27條等相關規定辦理。 
 
制定原則 
桃園市政府緊急傷病患救護作業程序手冊（以下簡稱本手冊）係以104
年桃園市高級救護技術員預立醫療流程暨線上醫療指導手冊為基礎，復參採
國內、外相關救護訓練教材及最新急救照護準則，在現行相關法令的前提下
所制定，以為本局各級救護技術員施行緊急救護的作業程序。 
 
注意事項 
本手冊包含各種傷病病情之流程及預立醫療流程，救護人員應熟記並遵
守，原則不得擅自逾越本手冊之規定。救護人員執行救護時，請依傷病患
之病情，優先處理可能危及生命、最嚴重、最主要之症狀，選擇最適當之
標準作業流程；如遇有特殊狀況，無法使用一般救護常規時，救護人員可
尋求線上醫療指導，並依線上醫療指導之指引處置傷病患。 
 
本救護作業程序中各種符號的意義： 
一、  「六角形」表示進入此流程之要件。 
二、  「菱形」表示條件和決定點，通常都將治療分成數個不同的方向。 
三、  「方形」表示實際的治療技術和方法。 
四、  「橢圓形」表示流程圖的終止。

4.  當無法有效建立人工呼吸道時，考慮以壓額抬下顎法徒手打開

註 1： 
  依下列順序判斷是否減少頸椎移動：

二、  有以下相關或傷勢時，給予頸椎減移： 
(一)  任一手、腳麻、無力或觸電感。

(四)  遊樂設施事故且撞擊頭部。 
(五)  車輛嚴重變形且撞擊頭部。 
四、  有以下影響脊椎損傷判斷情況時，給予頸椎減移： 
(一)  酒醉或受藥物影響。 
(二)  患者無法溝通，包含情緒激動、外籍人士、聽障或瘖啞人士等。 
(三)  其他部位嚴重創傷引致重大疼痛，包含長骨骨折、大而深傷口、
脫手套傷或碾壓傷等。 
(四)  無法確認是否頸椎受傷者。 
五、  患者左右旋轉頸部感到疼痛或受限時，給予頸椎減移。 
 
註 2： 
頸椎減移（Spinal Motion Restriction）： 
一、  創傷機轉為鈍傷之傷患，如疑似頸脊椎受傷或無法排除時，應減少
其頸椎移動，避免非必要移動。 
二、  頸椎減移的原則為任何可以減少頸椎移動的方式，包含： 
(一)  意識清楚可配合之傷患，以口語指示請其看向正前方，頭不要亂
動。 
(二)  意識清楚但無法配合口頭指令、意識不清之傷患疑似有頸脊椎傷

害或無法排除時，應給予徒手頸椎限制，如：頭部頸椎限制、雙
膝頸椎限制、肩部頸椎限制、頭肩部頸椎限制、胸骨前額頸椎限
制、胸骨脊椎頸椎限制或胸骨枕骨頸椎限制等方式。 
(三)  可使用頸圈減少頸椎移動，配合後續器材操作（長背板、KED、
鏟式擔架、全身式抽氣式護木等）。 
 
註 3： 
  依序以呼喚、輕拍與痛刺激方式區分意識為清、聲、痛、否 4 種等級；
痛刺激使用捏肩膀（按壓斜方肌）、按壓指甲床、眼眶上切跡給予 10 秒以內
或搓胸骨等方式。 
 
註 4： 
一、  初步評估： 
(一)  X：大量出血（eXsanguinating），應快速查看全身是否有立即可
見且持續之外出血情形，若有則直接加壓止血；對於立即可見且
持續之外出血施以有效止血，使用方式包含直接加壓止血、傷口
專用填塞紗布與止血帶止血法。 
(二)  Airway：評估呼吸道，視需要給予適當的呼吸道處置。 
(三)  Breathing：評估呼吸，視需要給予適當的氧氣治療。 
(四)  Circulation：評估循環，考慮給予溫暖輸液。 
(五)  Disability：評估失能 
(六)  Exposure/Environment：評估傷患身體（在保護傷患隱私下視情
形將傷患衣物移除，並注意保暖）。 
二、  輔助檢查（測量脈搏次數、血壓、血氧濃度及體溫），並視情況進
行下列評估及檢查： 
(一)  使用血壓機：頭部外傷患者如血壓上升、心跳變慢、合併呼吸不
規則，懷疑腦壓上升（庫欣氏三徵象，Cushing's triad）：進入「頭
部外傷救護流程」。

(二)  胸部聽診及扣診：進入「胸部外傷救護流程」。 
(三)  創傷重點評估超音波（Focused Abdominal Sonography for Trauma，
FAST)  ：進入「腹部外傷救護流程」。 
三、  其必要處置包含： 
(一)  頸椎減移。 
(二)  呼吸道處置。 
(三)  氧氣治療。 
(四)  建立周邊血管路徑。 
(五)  嚴重傷口之處理（頭、頸、胸、腹、骨盆的穿刺傷、大而深的
傷口、臟器外露、開放性氣胸性傷口或大面積灼燙傷等）。 
(六)  骨盆固定。 
(七)  骨折固定。 
(八)  頸圈及長背板固定。 
四、  若患者病情變化時，重新評估呼吸及脈搏，若無適當呼吸同時摸不
到頸動脈，立即進入「創傷心臟停止救護流程」。 
五、  患者無意識、有脈搏但呈現呼吸衰竭時，考慮以 BVM 進行人工呼
吸，每 2 分鐘重新評估呼吸及脈搏，給予後續處置。 
 
註 5： 
一、  包含現病史及過去病史。 
二、  病史應在初步評估的同時詢問，但不可延遲評估及處置之進行。 
 
註 6： 
  依「病情危急度判斷」評估。 
 
註 7： 
  危急個案的重大創傷患者，可考慮優先送往後送時間在 30 分鐘內的重
度急救責任醫院。

通用四「病情危急度判斷」 
一、  定義 
(一)  生命徵象： 
1.  急性意識不清（GCS 小於 14 分）。 
2.  呼吸每分鐘大於 29 次或小於 10 次。 
3.  脈搏每分鐘大於 150 次或小於 50 次。 
4.  收縮壓大於 200 mmHg 或小於 90 mmHg。 
5.  微血管充填時間大於 2 秒。 
6.  體溫大於攝氏 41 度或小於攝氏 32 度。 
7.  血氧濃度 SpO 2 小於 90％。 
8.  發紺。 
(二)  創傷部位： 
1.  體表面積大於 25％、顏面或會陰之二度或三度灼燙傷。 
2.  化學性或吸入性灼燙傷。 
3.  重大的電（雷）擊傷。 
4.  頭頸軀幹及肘膝處以上肢體之穿刺傷。 
5.  大量皮下氣腫。 
6.  氣管支氣管損傷。 
7.  內臟外露。 
8.  手腕或腳踝以上之截肢。 
9.  兩處以上大腿及上臂處長骨骨折。 
10.  骨盆腔骨折。 
11.  頭骨開放或凹陷性骨折。 
12.  肢體脈搏摸不到。 
13.  癱瘓。 
14.  壓碎傷。 
15.  嚴重撕裂傷。 
17 
桃園市政府緊急傷病患救護作業程序手冊 
(三)  創傷機轉： 
1.  成人大於 6 公尺或大於 2 層樓高之高處墜落。 
2.  小兒大於 3 公尺或大於 2 倍身高高度之高處墜落。 
3.  脫困時間大於 20 分鐘。 
4.  除遠端肢體外之身體被車輛輾過。 
5.  從車輛中被拋出。 
6.  同車有死亡者。 
7.  爆炸傷。 
8.  其他有高能量撞擊可能之創傷機轉。 
(四)  特殊情況： 
1.  血糖值小於 60 mg/dl 或顯示「低（low）」與血糖值大於 500 mg/dl
顯示「高（high）」。 
2.  疑似急性腦中風。 
3.  疑似缺血性胸痛發作。 
4.  持續抽搐或剛結束。 
5.  中毒可能危及生命。 
6.  小兒評估危急者。 
7.  急產。 
8.  毒蛇咬傷。 
9.  溺水。 
     
二、  處置原則 
(一)  經初步評估與必要處置後，若屬危急個案應儘速送醫。 
(二)  因為危急個案有較高的可能性發生到院前心跳停止，是以救護人員需
更加注意瀕死徵狀的發生，以儘早開始必要的急救。 
(三)  如傷病患為危急個案，應至少每 5 分鐘測量 1 次生命徵象；如傷病患
為非危急個案，則至少每 15 分鐘再次測量。 
(四)  特殊狀況（如缺血性胸痛、急性腦中風或重大創傷等）應依規定進行

通報並後送至合適之急救責任醫院。

考「小兒通用救護流程」。

桃園市政府緊急傷病患救護作業程序手冊 
註 1： 
一、  若有給予傷病患氧氣治療，駕駛人員於開車前，可協助後座救護人
員將攜帶式氧氣筒更換至車裝式氧氣筒，並協助量測患者生命徵象
及協助後座救護人員完成必要處置，再儘速駕車離開。 
二、  後座救護人員於送醫途中，進行生命徵象監測與二度評估，針對病
情惡化之傷病患，應立即確認患者有無生命徵象（包含適當呼吸及
頸動脈搏動）與瀕死徵象，並重新評估患者生命徵象與重點式理學
檢查，採取相對應之必要處置。 
 
註 2： 
一、  評估患者後，患者若為疑似急性腦中風、疑似缺血性胸痛或重大創
傷等情形，應後送至適當醫療院所及通報該醫院；若送醫路程大於
30 分鐘或生命徵象不穩定，應改送至就近適當醫療院所及通報該
醫院。 
二、  適當醫療院所參考： 
(一)  OHCA：距離最近之急救責任醫院。 
(二)  疑似急性腦中風：依患者情況與發作時間，送往能施打血栓溶解
劑（中風症狀發生時間小於 4.5 小時）或機械取栓術（中風症狀
發生時間小於 24 小時）之急救責任醫院。 
(三)  疑似缺血性胸痛：具有心導管能力之急救責任醫院。 
(四)  重大創傷：能處理重大創傷之急救責任醫院。 
(五)  嚴重灼燙傷：優先考慮有燙傷中心的急救責任醫院。 
(六)  創傷休克孕婦：就近適當急救責任醫院（最近有婦產科及小兒科
可以執行緊急生產之急救責任醫院）。 
 
註 3： 
一、  意識清楚患者：以傷病患覺得最舒適的姿勢。 
二、  意識不清患者：平躺。

三、  呼吸喘、疑似缺血性胸痛、疑似肺水腫、疑似急性腦中風患者：半
坐臥；惟如需要正壓給氧時，給予平躺。 
四、  懷孕 20 週以上之孕婦：建議給予左側躺。 
五、  休克患者：可考慮下肢抬高。 
六、  毒藥物中毒患者：若懷疑口服毒藥物中毒，且在 1 小時內發生者，
建議以左側躺後送。 
七、  腹痛患者：建議給予平躺屈膝或患者覺得最舒適的姿勢。 
 
註 4： 
一、  將 OHCA 患者自救護現場搬運至救護車內的過程中，CPR 中斷時
間儘量不超過 10  秒。 
二、  如傷病患於現場有生命徵象，上車後，救護人員應量測生命徵象並
持續給予必要處置。 
三、  如傷病患於搬運時或後送途中，有意識改變或病情惡化情形，應立
即確認患者是否有生命徵象（包含頸動脈搏動及正常呼吸）；若無
適當呼吸及脈搏，立即開始 CPR，若有，則量測其生命徵象並持
續給予必要處置。 
 
註 5： 
  生命徵象評估包括：意識、呼吸、脈搏、血壓、瞳孔、膚色、體溫及血
氧濃度，可視情況測量血糖。 
 
註 6： 
  依評估結果給予必要處置，包含： 
一、  呼吸道處置：如暢通呼吸道、放置人工呼吸道、進階呼吸道或抽吸。 
二、  氧氣治療：給予適當氧氣治療或 BVM 人工呼吸。 
三、  休克：控制外出血、建立周邊血管路徑或沒有頸、脊椎傷害疑慮時，
抬高患者下肢。

四、  低體溫：注意患者保暖及車上開暖氣。 
五、  中暑等熱急症：車上冷氣開至最大，於傷病患動脈點（頸部、腋下
及鼠蹊部）給予冰敷，得建立周邊血管路徑給予輸液降溫。 
六、  具刺鼻性或揮發性毒氣中毒：將車窗打開及關閉車內循環，並做好
個人防護措施。 
七、  若懷疑呼吸道、飛沫感染或法定傳染病個案：依不同傳染途徑（飛
沫、空氣或接觸等）提升個人防護措施，適時打開車窗通風或視情
況採取隔離保護。 
八、  車上電擊： 
(一) OHCA 患者於上車前曾使用 AED 電擊：若車上仍無脈搏且 AED
分析建議電擊時，可不停車，直接施行電擊。 
(二) OHCA 患者但於上車前 AED 未曾建議電擊：若車上仍無脈搏且
AED 分析建議電擊時，可視路況尋找安全處停車進行 AED 分析
（送醫途中以停車 1 次為限），之後直接送達醫院。 
(三) 送醫途中車上目擊 OHCA 患者：後座人員立即開始 CPR，視路況

以停車 1 次為限），並視情況給於必要處置，儘速送醫。 
(四) 如遇路況顛簸，EMT-P 可視狀況決定是否停車再次分析或直接電
擊（包含手動與自動電擊）。 
(五) AED 分析時，暫停自動心肺復甦機，以避免影響判斷。

二、  禁忌症 
(一) 非意識昏迷( GCS＞3 分)之傷病患。

二、  插管器械： 
(一)  喉鏡（Laryngoscope）直式或彎式之適當型號葉片。 
(二)  氣管內管。 
(三)  氣管內管通條（Stylet）。 
(四)  聲門上呼吸道。 
(五)  無菌空針筒。 
(六)  潤滑劑（Jelly）。

(十)  聽診器。 
(十一) 食道偵測器（EDD）或潮氣末二氧化碳監測設備（EtCO 2 ）。

三、  兒童氣管內管 
(一)  兒童的會厭軟骨較為細長柔軟不易控制，建議使用直式葉片。 
(二)  大於 8 歲兒童：使用有氣囊的氣管內管；小於 8 歲兒童：使用
無氣囊的氣管內管（因環狀軟骨是兒童呼吸道最狹窄的部位，
8-10 歲以後呼吸道最狹窄的部位則為聲帶）。 
(三)  兒科氣管內管內徑選擇： 
1.  無氣囊氣管內管號數（mm）＝（歲數÷4）＋4；有氣囊氣管
內管號數（mm）＝（歲數÷4）＋3。 
2.  也可使用小兒患者的第 5 根指頭（小指）粗細作為號數參考。 
(四)  兒科氣管內管深度選擇：插管深度（cm）＝（歲數÷2）＋12 或
插管的深度（cm）＝氣管內管內徑（mm）×3。 
 
註 3： 
一、  準備器械 
(一)  選擇適當葉片，測試喉鏡（Laryngoscope）燈光亮度是否正常。 
(二)  選擇合適之氣管內管（請參考附表）。 
(三)  測試氣囊有無漏氣（以空針筒打入空氣測試，確認無漏氣後再將

(四)  插入通條（Stylet）並塑形（通條勿凸出氣管內管，離氣管內管
前端 1 公分為宜）。 
(五)  以潤滑劑（Jelly）潤滑氣管內管前端，避免沾染到手以方便操作。 
二、  準備傷病患 
(一)  移除傷病患口腔內異物，必要時抽吸口中分泌物。 
(二)  在無頸椎傷害疑慮時，將傷病患置於嗅吸姿勢(即頸部在頸椎第
5、6 節處前彎，而頭部在頸椎第 1、2 節處仰伸，讓整個頸部側

(三)  以袋瓣罩甦醒球（BVM）給予 100%氧氣，正壓通氣。 
三、  插管   
(一)  以適當大小之喉鏡（附合適葉片）將下頷挑起。 
(二)  挑起至可目視聲帶（Vocal cords），必要時執行抽吸，如果有異
物以異物夾移除。 
(三)  持續目視可見聲帶，將氣管內管插入氣管，直至氣管內管氣囊穿
過聲帶 1-2.5 公分，必要時施行環狀軟骨按壓術（不建議例行使
用）。 
(四)  固定住氣管內管於 19-23 公分處（成人）。 
(五)  移開喉鏡及通條，持續固定住氣管內管。   
(六)  使用注射筒將氣囊充氣 8-10 ml  。 
四、  呼吸道嚴重阻塞（病人意識喪失）：若無法移除異物時，氣管內管
插入之重點步驟： 
(一)  以適當大小之喉鏡（附合適葉片）將下頷挑起。 
(二)  若異物夾無法移除異物，則將氣管內管經會厭推到最深刻度，將
異物推到單一側之支氣管中。 
(三)  再將氣管內管外拔至適當刻度（19-23 cm）。 
(四)  確認可達到單側通氣後給予氣管內管固定。 
五、  狀況排除要領 
(一)  喉鏡挑起時，如無法目視聲帶： 
1.  重新擺位成嗅吸姿勢打開呼吸道。 
2.  必要時施行環狀軟骨按壓術（不建議例行使用）。 
3.  將病人枕部墊高約 10 公分。 
4.  插管者將身體壓低，降低視線。 
(二)  可目視聲帶，但無法將氣管內管置入聲門內（或阻力很大）時，
考慮更換小 0.5 mm 之氣管內管。

六、  注意事項 
(一)  執行氣管內管插管時，以 1 次為原則；氣管內管插入後經確認
位置不正確時，應直接改置入聲門上呼吸道。 
(二)  插管時給氧中斷時間儘可能小於 30 秒，且儘可能減少壓胸中斷
時間。 
(三)  插管之間或插管失敗後，應給予袋瓣罩（BVM）正壓給氧。 
(四)  置入氣管內管後，應評估確認氣管內管位置，包括初級確認及
次級確認 2 種技術： 
1.  初級確認：插管時看到聲帶並從中插入，正壓給氧時視診兩側
胸部上升，及用聽診器聽診上腹部和兩側肺葉呼吸音。 
2.  次級確認：使用食道偵測器（EDD）或潮氣末二氧化碳監測設
備（EtCO 2 ）確認位置。 
(五)  每當有移動傷病患後，應再次確認氣管內管位置。

一、  以甦醒球正壓通氣，每次給氣應確認胸部均有起伏。 
二、  聽診上腹部無聲音，接著聽診兩側肺底部及肺尖部。 
三、  若上腹部有咕嚕聲且胸部沒有起伏時，代表可能插入食道，應立即

四、  若左側聽不到呼吸音，代表可能放置過深進入右側支氣管，須先將
氣囊消氣之後外拔至適當深度，再打氣固定後，重新確認呼吸音。

一、  食道監測器（EDD）：待氣管內管打上氣囊後，先擠壓  EDD  球體

二、  潮氣末二氧化碳監測設備（EtCO 2 ，如有波形顯示請參考附圖）： 
(一)  有生命徵象的患者，EtCO 2 約為 35-45 mmHg。

(二)  正在被 CPR 的傷病患者，EtCO 2 應≧10 mmHg，若＜10 mmHg
應改善壓胸品質（如：速度、深度或中斷等），或考慮換手、重
新確認氣管內管位置。 
(三)  若 OHCA 傷病患 EtCO 2 數值突然≧40 mmHg 及出現 6 個以上正

三、  氣管內管固定後，如發生通氣異常，應依序進行評估並排除異常： 
(一)  氣管內管位移：再次確認氣管內管固定深度位置（19 至 23 公

(五)  若仍然通氣異常，應立即移除氣管內管並改置入聲門上呼吸道。

一、  移除傷病患口腔內異物，必要時抽吸口中分泌物。 
二、  將面罩前端緊貼上硬顎，再順著硬顎、軟顎滑入至咽喉部（如有氣
囊，以空針筒將面罩充氣，充氣數依各別廠牌使用建議）。

桃園市政府緊急傷病患救護作業程序手冊 
註 4： 
一、  接上甦醒球通氣，若無可見的胸部起伏時，嘗試調整聲門上呼吸道
深淺、位置及再次暢通呼吸道。 
二、  患者 OHCA 時，甦醒球通氣測試時機依 30：2 於吹氣時給予，勿
輕易暫停壓胸。 
 
註 5： 
一、  接上袋瓣罩甦醒球（BVM）給予吹氣，確定有可見的胸部起伏後，
不論有無脈搏得給予每6 秒1次或配合患者呼吸型態給予正壓呼吸；
但若為單人 CPR 時，得與胸部按壓依 30：2 之壓吹比進行。 
二、  考慮使用儀器監測潮氣容積及 EtCO 2 數值。 
三、  潮氣末二氧化碳監測設備（EtCO 2 ，如有波形顯示請參考「氣管內
管插管流程」附圖）： 
(一)  有生命徵象的患者，EtCO 2 約為 35-45 mmHg。 
(二)  正在被 CPR 的傷病患者，EtCO 2 應≧10 mmHg，若＜10 mmHg
應改善壓胸品質（如：速度、深度或中斷等）或考慮換手、重新
確認聲門上呼吸道位置。 
(三)  若 OHCA 傷病患 EtCO 2 數值突然≧40 mmHg 及出現 6 個以上正
常波形，表示患者可能回復自發性循環，於 AED 分析心律時檢
查頸動脈搏後，給予適當處置。

桃園市政府緊急傷病患救護作業程序手冊 
註 1： 
一、  本流程適用於 1 歲以上患者。 
二、  如疑似為液體阻塞，考慮執行抽吸。 
 
註 2： 
  輕度阻塞者通常能咳嗽與發出聲音，有機會靠自己的力量將異物咳出。
此時救護人員應鼓勵其咳嗽及密切監視即可，通常不需過度介入。 
 
註 3： 
  咳嗽聲逐漸變小至無聲、無法說話、出現喘鳴聲（stridor）、發紺、呼
吸窘迫、或意識改變時，就表示阻塞嚴重，無法自行咳出異物，此時就要救
護人員協助處置。 
 
註 4： 
一、  應立即在病人後面使雙腳成弓箭步、前腳膝蓋置於病人胯下、上半
身靠近或貼緊病人背部以穩住病人。 
二、  一手握拳（大拇指與食指形成之拳眼面向肚子）放於上腹部正中線，
位置於肚臍上緣，另一手抱住放好之拳頭（若無法實施腹部推擠應
考慮胸部按壓，例如：懷孕後期或肥胖者）。 
三、  雙手用力向病人的後上方快速瞬間重複推擠，且隨時留意是否有異
物吐出，直到病人意識喪失或異物被排除為止。 
四、  因環境或病患因素，無法施行哈姆立克法時，給予高濃度氧氣治療，
密切監視，有無惡化至意識喪失。 
五、  重複步驟一至三，直到阻塞解除或已執行 2 分鐘後儘速送醫。 
六、  哈姆立克法若施力位置不當，可能造成患者臟器破裂，執行時請特
別留意。 
 
 
41 
桃園市政府緊急傷病患救護作業程序手冊 
註 5： 
一、  弓箭步之前腳應往後退，小心迅速的讓病人仰躺於地上（已虛脫之
病人依基本生命急救術之流程操作至下列步驟若有相同狀況時，即
應懷疑為異物哽塞而給予相同之處置）。 
二、  打開病人的呼吸道，同時間若發現病人嘴內有可見的固體異物時，
應先將病人頭部側向一邊，實施手指清除異物。 
三、  若已清除或無可見的固體異物時，給予吹氣 1 次。 
四、  若氣吹不進去或胸部沒有升起時，重新打開呼吸道，再吹氣 1 次。 
五、  若氣仍吹不進去或胸部沒有升起時，應立即給予胸部按壓 30 次（按
壓速率每分鐘 100 至 120 次）。 
六、  同時要目視是否有異物吐出或阻塞解除的現象。若施救者發現病患
口中有可見之異物，才可以手指或器械移除，未看到異物前不需常
規性盲目挖除。 
七、  重複步驟二至六，直到阻塞解除或已執行 2 分鐘後儘速送醫。 
八、  若患者 OHCA 時（摸不到頸動脈）：使用 AED，並依「到院前心
臟停止救護流程」操作。 
 
註 6： 
一、  以喉頭鏡查看患者口咽處有無異物。 
二、  嘗試以異物夾（Magill forceps 或 Kelly clamp）移除異物。 
 
註 7： 
一、  若異物夾無法移除異物，則將氣管內管經會厭推到最深刻度，將異
物推到單一側之支氣管中。 
二、  再將氣管內管外拔至適當刻度（19-23 cm）。 
三、  確認可達到單側通氣後給予氣管內管固定。 
 
 
42 
桃園市政府緊急傷病患救護作業程序手冊 
註 8： 
  如口中有可見異物，挖除後應給以甦醒球吹氣並確認胸廓有起伏，以確
認異物是否已完全排除。 
 
註 9： 
  曾經或正在發生之呼吸道異物哽塞患者，以高濃度氧氣治療（甦醒球或
非再吸入型氧氣面罩）為首選。 
 
註 10： 
  避免使用口咽及聲門上呼吸道，造成異物更深入。

桃園市政府緊急傷病患救護作業程序手冊 
註 1： 
一、  氣切管未完全脫離傷病患： 
(一) 考慮嘗試將氣切管復位，並予以適當固定。 
(二) 氣切管無法復位時，處置步驟如下： 
1.  先嘗試改於氣切口處給氧。 
2.  如無效，再嘗試改於口鼻處給氧。 
(1) 有氣囊型氣切，應先將氣囊空氣抽空，再從口鼻給氧。 
(2) 無氣囊型氣切，可直接從口鼻給氧。 
二、  氣切管已完全脫離傷病患：可優先在氣切口處給氧，如無效再改於
口鼻處給氧，並儘速送醫。 
 
註 2： 
一、  評估人工氣道是否有分泌物影響呼吸，抽吸前先給予氧氣治療及血
氧濃度監測。 
二、  選擇適當的抽吸管號數及確認有效期限。 
三、  使用電動抽吸器時，查看抽吸器電池電量及拔除抽吸器連接管前端
接頭。 
四、  使用攜帶式氧氣組內抽吸器時，拔除抽吸硬管，接上轉接軟管。 
五、  運用無菌技術打開抽吸包，不可讓抽吸管碰觸到非無菌面。 
六、  取出抽吸包內的無菌手套攤開後，可脫除慣用手之一般手套，將慣
用手伸入無菌手套後，分開無菌手套與紙面。 
七、  此時穿戴無菌手套的慣用手須保持無菌技術拿取抽吸管，而非慣用
手則拿取抽吸器連接管，將抽吸管通氣孔處的綠色接頭固定於連接
管。 
八、  在尚未開啟抽吸的情況下，以慣用手輕柔迅速地將抽吸管置入人工
氣道（最好試著在患者吸氣時將抽吸管置入人工氣道），直到感到
阻力或患者咳嗽，然後往回拉約 1 公分（自造口處伸入氣管之中，
深度不要超過 7-12 cm）。 
48 
桃園市政府緊急傷病患救護作業程序手冊 
九、  使用電動抽吸器時，藉由非慣用手的拇指置於抽吸管的通氣孔上，
壓住通氣孔進行連續性抽吸，且以慣用手慢慢地將抽吸管由內向外
旋轉抽吸退出。 
十、  使用攜帶式氧氣組內抽吸器時，先將抽吸管的通氣孔關閉，藉由非
慣用手的拇指按壓抽吸鈕進行連續性抽吸，且以慣用手慢慢地將抽
吸管由內向外旋轉抽吸退出。 
十一、  抽吸期間須觀察傷病患是否有呼吸窘迫。若傷病患的脈搏每分
鐘下降超過 20 下，或每分鐘增加超過 40 下，或血氧機顯示血氧濃
度低於 90%或比平時基準值低 5%，應停止抽吸。 
十二、  重新評估是否繼續抽吸，若需再次抽吸，則先給予足夠的時間
（至少完整的 1 分鐘）換氣和給氧，並鼓勵傷病患深呼吸和咳嗽。 
十三、  當氣管的分泌物清除完畢後，可進行口咽抽吸，以清除口腔分
泌物。 
十四、  將抽吸管纏繞於慣用手的手指上，反脫手套，以手套包覆髒汙
的抽吸管，且以相同方式脫下另一個手套包覆第一個手套，以密封
染汙物，再將其丟棄於感染性廢棄物垃圾袋中。 
十五、  重新帶上手套，關閉抽吸器。 
 
註 3： 
  患者血氧濃度小於 94％時，選擇下列適當方式給予氧氣治療； 
一、  使用氣切專用面罩。 
二、  使用小兒氧氣面罩置於氣切管上方給予罩住氣切口（需留有空隙供
換氣，不得緊密接合）。 
三、  如患者原接有呼吸器或專用導管，應接續使用至交接給醫院為止。 
四、  使用一、二方式給氧後，如仍成效不佳，則改以甦醒球 6 秒 1 口氣
之頻率給氧： 
(一)  氣切管暢通傷病患：可使用成人甦醒球，對患者氣切口，進行給
氧。

(二)  氣切管完全脫離傷病患，可使用小兒面罩之成人甦醒球，對患者
氣切口，進行給氧。 
(三)  氣切管完全阻塞病患： 
1.  有氣囊型氣切，應先將氣囊空氣抽空，再從口鼻甦醒球給氧。 
2.  無氣囊型氣切，可直接從口鼻甦醒球給氧。 
(四)  搬運傷病患時，建議暫時移除甦醒球，或以蛇形管連接，以免氣
切管遭不慎扯落。 
 
註 4： 
一、  當傷病患符合以下所有條件，且 EMT-P 與家屬說明解釋傷病患目
前情況後，可啟動線上醫療指導，考慮移除氣切管（惟 OHCA 傷
病患氣切管，如無法復位或完全阻塞時，可無須經線上醫療指導，
直接移除）： 
(一)  氣切管無法復位或氣切管完全阻塞時。 
(二)  施行上述治療皆無效。 
(三)  血氧濃度持續＜90%。 
(四)  急性意識昏迷（GCS＝3）。 
二、  移除氣切管後續給氧與治療方式，其順序如下： 
(一)  優先施行經口置入氣管內管後給氧(氣囊須通過氣切口)。 
(二)  可使用小兒面罩之成人甦醒球，對患者氣切口，進行給氧。 
(三)  氣切口收縮且無法經口置入氣管內管，則由口鼻以成人甦醒球給
氧。

一、  成人（有第二性徵）檢查頸動脈搏。

CPR。 
 
註 2： 
一、  懷孕 20 週以上或腹部明顯隆起的孕婦 OHCA 時，於現場或車上人
力許可下，可使用徒手將明顯脹大的子宮推向病患左側以減少對右
側下腔靜脈之壓迫，以增加回心血量。 
二、  到達現場若已使用 PAD，建議更換本局 AED 以利後續作業（以不
中斷 CPR 為原則）。 
三、  AED分析心律如不建議電擊，不需再次評估脈搏，應立即開始CPR，
之後每 2 分鐘再次評估脈搏。 
 
註 3： 
  依 AED 建議及指示進行電擊；EMT-P 判讀心律後，必要時可將 AED 改
成手動模式進行電擊，或使用手動電擊器執行電擊。 
 
註 4： 
一、  置入進階呼吸道時，不應中斷CPR。 
二、  置入進階呼吸道後，得同時連續壓胸及每6秒給1口氣。 
三、  可使用潮氣末二氧化碳監測設備（EtCO 2 ）監測CPR品質。 
(一)  正在被CPR的傷病患者，EtCO 2 應≧10 mmHg，若＜10 mmHg應改
善壓胸品質（如：速度、深度或中斷等）或考慮換手、重新確認聲
門上呼吸道或氣管內管位置。 
(二)  若OHCA傷病患EtCO 2 數值突然≧40 mmHg及出現6個以上正常波
形，表示患者可能回復自發性循環，於AED分析心律時檢查頸動
脈搏後，給予適當處置。

四、  執行氣管內管插管時，以1次為原則；氣管內管插入後經確認位置不
正確時，應直接改置入聲門上呼吸道。 
五、  置入進階呼吸道後，應避免過度通氣，見到胸部起伏即可。 
 
註 5： 
一、  急救人力足夠時（3 人以上），考慮建立周邊血管路徑，給予生理
食鹽水注射液。 
二、  施打骨針之禁忌症為： 
(一)  施打部位骨折、感染或裝有人工關節。 
(二)  48小時內同部位曾施打過IO。 
 
註 6： 
一、  每 4 分鐘重複給予 Epinephrine（1:1000），lmg，靜脈或骨內推注；
即以 2 分鐘 CPR 為 1 個循環計算，每間隔 1 個循環重複給予。 
二、  遇頑固型無脈 VT 或 Vf 時，給予 Amiodarone，第 1 次劑量為 300mg，
第二次劑量為 150mg，靜脈或骨內推注，時間間隔為 2 分鐘（建議
為 AED 再次分析及電擊後）。 
三、  Epinephrine 與 Amiodarone 推注時間間隔建議為 1 分鐘。 
 
註 7： 
一、  建議於離開現場前架設自動心肺復甦機，搬運患者時應隨時注意壓
胸位置。 
二、  雖目前尚無證據顯示機械式壓胸裝置可以取代高品質的人工胸部按
壓，惟考量救護車後座空間、後送醫院車程、路面坑洞顛簸或救護
人力限制等因素，且車輛疾速行駛中操作 CPR 無疑係屬危險工作環
境，因此仍建議使用自動心肺復甦機。 
三、  使用自動心肺復甦機後，應注意避免過度的通氣，且每 2 分鐘需再
次評估脈搏。

註 1： 
一、  疑似抽搐發作如肢體抽搐、意識喪失、雙眼上吊及大小便失禁等。 
二、  病史詢問時，應瞭解患者抽搐時間、次數、抽搐發生型態、過去病
史及用藥史；其中抽搐發生型態說明如下： 
(一)  全身性抽搐：腦部的異常電氣活動範圍比較廣泛，包括失神小發
作（4-12 歲小孩較容易發生）及大發作。 
(二)  局部抽搐：某一大腦皮質的特定部位產生異常電氣活動的結果 
三、  應依照患者狀況給予適時的呼吸道處置及氧氣治療，勿因等待抽搐
結束後才接觸患者進行初步評估，以免造成後續嚴重併發症。 
四、  如患者無癲癇病史，需注意是否為心臟問題，因為有時候心室頻脈
（VT）)或心室顫動（Vf）引起腦部灌流不足的表現，跟癲癇很像；
因此當患者抽搐結束後，需立即評估有無適當呼吸同時檢查頸動脈
搏。 
 
註 2： 
一、  持續抽搐指救護人員到達現場時，患者仍在抽搐；救護人員需儘快
取得患者相關病史。 
二、  患者持續抽搐時，應先移開現場物品，以免造成患者受傷；如因抽
搐發作而導致創傷，救護人員需依「創傷病患緊急救護現場流程」
原則處置。 
三、  當患者連續抽搐超過 5 分鐘，或在 2 次抽搐發作間意識未能恢復，
即為「癲癇重積狀態（Status epilepticus）」；此時代表腦部已持續放
電一段時間，如未積極處理容易造成腦部缺氧嚴重受損、橫紋肌溶
解、代謝性酸中毒、肺水腫、續發性創傷等嚴重併發症。

註 5： 
EMT-II 得協助使用腎上腺素注射筆；不同廠牌可能有不同操作方式，以

一、 注射部位為患者大腿外側肌肉。 
二、 移除藍色蓋子。 
三、 握著筆桿，將橘色處朝大腿（注射部位）。 
四、 勿將大拇指放於藍色末梢，僅緊握著筆桿朝大腿外側肌肉扎入。 
五、 扎入後，將注射器牢牢地固定在大腿，停留至少 3 秒鐘才移除。

一、  注射部位選擇上臂肩峰以下 3 指幅之三角肌處或大腿外側。

一、 方法 1：請患者咳嗽或深呼吸。 
二、 方法 2：頸動脈竇按摩術（Carotid Sinus Massage），如病患有中風
病史，或頸動脈狹窄或頸動脈相關疾病，則避免操作： 
（一） 按摩時患者姿勢需為平躺，並請患者下巴抬高。 
（二） 操作者先將自己的食中指併攏，接著觸摸患者甲狀軟骨（喉結處），
然後以患者之水平方向往患者外側移動（左側或右側），所摸到
之搏動處既為按摩位置，按摩位置之左右側選擇通常以病人慣用
手側為優先，如病人慣用手為右手，則先以按壓右側為主。 
（三） 先以聽診器聽兩側按摩位置是否有雜音（Carotid bruit）。 
（四） 如無雜音則於按摩位置持續按壓 5 秒，應避免按壓超過 10 秒以
及避免兩側同時按壓，如無反應可在於病患對側操作一次，操作
時間應間隔 1-2 分鐘。 
三、 方法 3：改良式伐氏呼吸法 Modified Valsalva maneuver 
（一） 請先讓患者半坐臥。 
（二） 準備 10 ml 空針筒並要求病患於對針筒用力吹氣 15 秒。 
（三） 吹完後請快速讓病患躺平，並把雙腳抬高 45 度 15 秒鐘。 
（四） 持續監測監測器心律變化。

註 1： 
一、  休克（Shock）為人體的器官或組織因血液灌流不足而引起的綜合症
狀，臨床上有很多表現，救護人員在到院前評估可評估的徵候如下： 
(一)  意識改變，混亂甚至昏迷。 
(二)  呼吸加快或變深。 
(三)  心跳加快（＞l00 次/分或脈搏微弱）。 
(四)  血壓＜90 mmHg。 
(五)  微血管充填時間≧2 秒。 
(六)  臉色蒼白。 
(七)  濕冷的皮膚。 
二、  可透過評估「休克指數（Shock Index, SI）」來輔助判斷患者目前是
否有休克情形： 
(一)  休克指數計算方式為：脈搏次數/收縮壓，例如：脈搏 120 下/分，
收縮壓 90 mmHg 時，休克指數為 1.33。 
(二)  當休克指數大於 1 時，患者可能有休克情形；意即當患者脈搏次數
大於收縮壓時，患者可能休克。 
(三)  惟仍應配合機轉、病史及其他生命徵象綜合判斷，不可因患者休克
指數小於 1，而認定患者無休克。 
三、  休克可初步分成 4 類 
(一)  低血容性休克：病史常包含解黑/血便、吐血等，到院前常見眼瞼
蒼白、CRT>2 秒、末梢肢體濕冷。 
(二)  分布性休克：包含過敏性休克、敗血性休克、神經性休克。 
(三)  心因性休克：病史常有心臟病、心衰竭病史、胸悶/痛等，到院前
常見端坐呼吸、呼吸濕囉音、末梢肢體濕冷。 
(四)  阻塞性休克：包含張力性氣血胸、心包膜填塞。 
四、  此流程為初評完成後根據患者現場症狀及生命徵象綜合判斷後進
入。 
 
註 2： 
致命性過敏反應包含：意識不清、呼吸衰竭、出現喘鳴音（Stridor）或
哮喘音（Wheezing）、發紺、有發生在嘴唇、舌頭及眼眶周圍等黏膜組織等

血管性水腫、收縮壓小於 90 mmHg 或其他休克徵狀（如皮膚濕冷、微血管
充填時間大於 2 秒等）。 
 
註 3： 
張力性氣胸臨床症狀包含胸痛、喘、呼吸困難、患側呼吸聲變小或聽不
到、皮下氣腫、扣診鼓音或過清音、氣管偏向對側、頸靜脈怒張、休克；此
時生命徵象可能血氧低(＜94％)、微血管填充時間延長(≧3 秒)、收縮血壓低
(＜90 mmHg)、脈搏快(＞100 下/分鐘)。 
 
註 4： 
急性心臟衰竭病患可能之臨床症狀包含呼吸急促、胸悶、腳腫、尿少或
端坐呼吸等，而理學檢查可發現頸靜脈怒張，呼吸音可聽到兩側濕囉音，按
壓下肢會出現凹陷性水腫。 
 
註 5： 
到院前治療包含： 
一、  維持 SpO 2 在 92-98%。 
二、  給予保暖。 
三、  考慮實施下肢抬高。 
四、  除急性心臟衰竭外，考慮嘗試靜脈輸液。

  張力性氣胸： 
一、 症狀：胸痛、喘、呼吸困難。 
二、 跡象：患側呼吸聲變小或聽不到、皮下氣腫、扣診鼓音或過清音、

三、 生命徵象：血氧低(＜94％)、微血管填充時間延長(≧3 秒)、收縮血

註 3： 
  開放性氣胸： 
一、 症狀：呼吸窘迫。 
二、 跡象：胸部有開放性傷口、傷口處有空氣進出。 
三、 生命徵象：低血氧。 
 
註 4： 
一、 於胸部創口處使用胸封貼片，或以不透氣敷料覆蓋，貼三邊留一邊；
隔絕傷口避免感染，使氣體僅能由肋膜腔傷口處洩出。 
二、 若為胸部穿刺傷，須適當固定異物，不可嘗試拔除。 
 
註 5： 
  其他胸部外傷包括： 
一、 心包膜填塞：頸靜脈怒張、心音遙遠、低血壓（貝克三病徵 Beck's triad）、
胸前傷勢、休克。 
91 
桃園市政府緊急傷病患救護作業程序手冊 
二、 創傷性主動脈剝離：低血壓、兩側橈動脈可能不對稱。 
三、 大量血胸：呼吸窘迫、血壓下降、患側呼吸音減弱。 
四、 呼吸道阻塞：發紺、血氧下降、喘鳴音（stridor）。 
五、 氣管破裂：呼吸窘迫、皮下氣腫，容易演變成張力性氣胸。 
 
註 6： 
一、 致命的胸部創傷（如呼吸道阻塞、張力性氣胸、開放性氣胸、心包膜
填塞、大量血胸或氣管破裂等）在院前雖不易判斷，但救護人員仍可
給予適當處置以維持患者生命徵象，如： 
(一)  維持患者呼吸道暢通。 
(二)  給予適當的氧氣治療以矯正患者呼吸問題。 
(三)  建立周邊血管路徑給予輸液以矯正患者血壓問題。 
二、 將患者送往適當的急救責任醫院。 
 
註 7： 
一、  執行必要處置及身體檢查後，可考慮使用延伸重點式創傷超音波
（Extended Focused Assessment with Sonography for Trauma，E-FAST）
來輔助評估。 
二、  超音波操作重點如下： 
(一) 使用時機為明顯胸腹部創傷機轉患者合併下列情形之一： 
1.  全身無明顯的外出血，卻有休克現象。 
2.  胸腹部有可見之大片瘀傷腫脹。 
3.  其他救護人員判斷有使用的必要時。 
(二) 在 M-Mode（動態模式）下將探頭放置於鎖骨中線第二/第三肋間，
查看是否有氣胸；在劍突下進行掃描查看有無心包膜積液。 
(三) 不可因進行超音波檢測，而延誤送醫時間。 
(四) 如檢測發現有不正常的氣體或液體，通知後送醫院，或於到院後主
動告知醫護人員。

註 1： 
一、 腹部創傷是造成傷患死亡的主因之一，腹腔為人體最大的體腔，可
容納大量的血液及體液；一旦臟器或血管破損出血，可在短時間內
造成出血性休克危害生命。 
二、 腹部創傷在初期症狀不明顯，不可因腹部無外傷就排除其受傷的可
能。 
三、 經患者同意之下進行腹部的視診及觸診： 
(一)  視診有無體表的外傷，如擦傷、撕裂傷、瘀傷等。 
(二)  觸診腹部有無明顯的壓痛感或局部肌肉僵硬。 
四、 以上情形都代表底下的臟器有可能受傷。 
 
註 2： 
  以濕紗覆蓋後適當包紮，不可嘗試將外露的臟器塞回。 
 
註 3： 
  不可嘗試拔除異物，利用三角巾、彈性繃帶等將異物適當固定。 
 
註 4： 
  骨盆穩定度檢查以 1 次為限。 
 
註 5： 
  可使用骨盆固定帶、三角巾、被單包覆或使用 KED 固定。 
 
註 6： 
一、 超音波能快速檢查並發現腹內積液。雖然無法區分積液種類，但對
於所發現到的腹內積液，都應被視為嚴重腹部創傷造成出血。 
二、 執行必要處置及身體檢查後，可考慮使用重點式創傷評估超音波
（Focused Abdominal Sonography for Trauma，FAST)來輔助評估。 
94

三、 超音波操作重點如下： 
(一) 使用時機為明顯胸腹部創傷機轉患者合併下列情形之一： 
1. 全身無明顯的外出血，卻有休克現象。 
2. 胸腹部有可見之大片瘀傷腫脹。 
3. 其他救護人員判斷有使用的必要時。 
(二) 順序：右側腹-左側腹-下腹-劍突下方。 
(三) 執行時注意事項如下：   
1. 不要只看單一面，應前後來回掃描，偵測是否有少量積液。 
2. 在脾腎之間掃描時，因左側有脾腎韌帶，在此韌帶破裂之前，水
不易流至脾腎交界，因此建議以掃橫膈膜的方式，檢查橫膈膜下
方是否有積液。 
3. 掃描膀胱時，建議以橫向及縱向掃描，因為在腹內出血同時膀胱
無尿時，如僅以橫向掃描，容易把積水當作膀胱。 
(四) 不可因進行超音波檢測，而延誤送醫時間。 
(五) 如檢測發現有不正常的氣體或液體，通知後送醫院，或於到院後主
動告知醫護人員。 
(六) 在操作與清理探頭時，應小心避免刮傷探頭造成探頭損壞。 
四、  患者如有休克現象，應參考「創傷出血性休克救護流程」。

三、 如傷口位於肢體、鼠蹊或腋下等與軀幹交界處，可視情況以無菌紗

（一） 脈動式的動脈出血或持續性出血。 
（二） 大量出血在地上積聚成池。 
（三） 加壓包紮後的敷料無效且持續被血液浸濕。 
（四） 手腕或腳踝以上之截肢。

一、 止血帶位置選擇分為「緊急止血」與「確切止血」2 種時機： 
（一） 「緊急止血」操作時機為情況危急或無法明確定位出血點時，可
嘗試將止血帶綁在肢體最近心端（最高點）直接使用。 
（二） 「確切止血」操作時機為情況允許且明確定位出血部位，將止血
帶綁在出血處近心端，距離傷口約 5-8 公分處（約 4 指幅寬度），

二、 止血帶使用步驟： 
（一）  放置於正確部位拉緊至手指無法穿越。 
（二）  開始旋緊旋桿至出血停止。 
（三）  固定旋桿。

（四）  確認遠端脈搏摸不到，若仍能摸到應確認止血帶是否旋緊，或考

（五）  標記止血帶使用時間於明顯部位。

二、 合併多處創傷之病患可能無法完全確認其所有受傷部位，特別注意

註 1： 
  灼燙傷可能造成的傷害包含有： 
一、 呼吸道高溫傷害：呼吸道產生水腫引發氣管阻塞。 
二、 濃煙傷害：一氧化碳妨礙氧氣與血紅素結合。 
三、 皮膚灼燙傷： 
（一）  休克：大面積灼燙傷會使體液快速喪失導致低血容休克發生。   
（二）  體溫喪失：大面積灼燙傷造成皮膚無法保持體溫，特別是夜晚
或氣溫低時。   
（三）  感染：因失去皮膚保護功能，造成感染引發敗血症等相關問題。 
 
註 2： 
  電燒傷可能造成的傷害及處置如下： 
一、  觸電可能造成肌肉收縮或僵直性痙攣，要特別注意是否合併骨折，
尤其是頸部。 
二、  約 30％被閃電擊中的患者，會併發心臟和呼吸驟停，且身體可能有
灼傷、抽筋、皮膚外觀可能呈現雷擊紋。 
三、  不管是遭受雷擊或是觸電的傷患皆需考慮有無因電擊而從高處摔落
的可能。 
四、  閃電像一個瞬間巨大的直流電擊，可能造成心室停止；交流電常導
致心室纖維顫動，而交流電及雷擊二者均可能引起呼吸停止。 
五、  電灼傷可能會有兩個較明顯傷口，一般於「入口」及「出口」處之
灼傷最為嚴重，而入口處又比出口處嚴重。 
六、  病史詢問時傷患可能有耳朵疼痛、聽力減退等耳膜震裂的表現。 
七、  於送醫途中視情形持續給予心律監測。 
 
註 3： 
  化學灼傷可能造成的傷害及處置如下： 
一、  化學灼傷：酸、鹼腐蝕物質或其他刺激性化學物品導致之灼傷。 
110 
桃園市政府緊急傷病患救護作業程序手冊 
二、  以適當方式清除患者皮膚上的污漬及藥品；需注意有些粉末狀或禁
水性物質，不可用水清洗。 
三、  遇有患者眼睛遭化學灼傷時，EMT-Ⅱ以上救護人員得施行灌洗眼
睛： 
(一)  處理時應特別注意自我保護。 
(二)  以大量清水沖洗患處，以減少或降低化學灼傷的持續進行。 
(三)  可以靜脈點滴管或鼻導管連接生理食鹽水來持續沖洗，沖洗時應從
患眼鼻側往外側沖洗，注意不要污染另一隻正常眼睛。 
(四)  在幫患者打開眼瞼時，應避免手指壓迫到傷患眼球，而是施力在眼
眶骨上。 
(五)  患者若戴隱形眼鏡，建議自行摘除。 
 
註 4： 
  低溫凍傷（凍瘡）可能造成的傷害及處置如下： 
一、 低溫凍傷（凍瘡）可能因為長時間暴露在零下低溫狀態或直接接觸的
凍傷（凍瘡）而造成。 
二、 如患者因長時間暴露在零下低溫而合併有冷急症傷害時，依特殊十五
「長途就醫及野外地區作為救護流程」註 18 進行評估及處置，考慮
給予溫暖輸液。 
三、 建議將患處浸泡於 37 至 40℃的水中回溫，需小心已執行回溫處置的
患處應避免再次暴露在低溫環境中，因二次凍傷恐造成組織壞死。 
 
註 5： 
一、  處理燒灼傷的患者，首要步驟為移除熱源，以中斷傷害的進行。 
二、  以生理食鹽水或乾淨的水沖洗傷處，但忌用冰水、冰塊，並小心移
除衣物及可能蓄積熱能的配件（如：戒指、項鍊、手錶、皮帶等）。 
三、  無法移除之衣物或衣物已黏附皮膚上，用浸濕的紗布覆蓋其上，以
防止蓄熱反應繼續進行。

二、  防護措施未完備前，應與傷病患保持 1 公尺以上之安全距離。 
三、  移除病患受到染污的衣服。 
四、  以適當方式清除患者皮膚上的污漬及藥品；需注意有些粉末狀或禁
水性物質，不可用水清洗。 
五、  若懷疑化學氣液體中毒時，應由著有防護裝備之人員先行，以確認
現場環境安全，且使用化學氣體偵測設備；評估傷病患前需有效通
風，或將傷病患移至相對安全處，同時確認同一區域內有無其他傷
病患。 
六、  即使傷病患為危急個案，仍應在確保自身前提下進行評估與處置。 
 
註 2： 
  初步評估時應留意患者是否有口水或氣管分泌物增加、腐敗性液體造成
上呼吸道水腫、呼吸抑制甚至衰竭、低血壓、頻脈或緩脈、蒼白或發紺、濕
冷的皮膚、瞳孔放大擴散或呈現針狀等情形，並給予維持呼吸道、抽吸、給
氧等相應的處置。 
 
註 3： 
  對於固體或液體毒藥物中毒者，在送醫前可以塑膠袋將裝有毒物之瓶子
密封，或將藥瓶或藥袋帶至醫院。 
 
註 4： 
  若現場關係人有提供解毒劑（如葡萄糖酸鈣軟膏、六氟靈、敵腐靈等化
學沖淋套件），EMT 可於到院前協助使用。 
 
註 5： 
一、  有機磷可由皮膚、口和吸入方式吸收。 
二、  常見有機磷毒化物多為「松」字結尾之農藥、亞素靈（Azodrin）、
119 
桃園市政府緊急傷病患救護作業程序手冊 
拜貢及好年冬（氨基甲酸鹽類）。 
三、  有機磷或氨基甲酸鹽中毒可能出現症狀:  緩脈、縮瞳（針狀瞳）、
肺音濕囉音及下列症狀（口訣：SLUDGE）： 
（一） Salivation 流口水。 
（二） Lacrimation 流眼淚。 
（三） Urination 尿液產生。 
（四） Defecation 排便。 
（五） Gastrointestinal upset 腸胃不適。 
（六） Emesis 嘔吐。 
 
註 6： 
一、  當患者出現心搏過緩（小於 50 次/分）、哮鳴音（wheezing）或聽
診時有濕囉音（crackles）時，可能有致命性症狀「Killer B」（即
Bradycardia 緩脈、Bronchospasm 支氣管痙攣、Bronchorrhea 支氣
管分泌物增加），EMT-P 可考慮給予 Atropine。 
二、  EMT-P 給予 Atropine 說明如下： 
（一）  成人劑量為 1 mg  ，小兒劑量為 0.025 mg/kg，均為靜脈推注。 
（二）  注射後若未改善，可每 5-10 分鐘重複給予（最大劑量 3 mg）。 
（三）  需於救護紀錄表中註記給予 Atropine 的適應症、劑量及時間，
並主動與醫護人員交接。 
（四）  如患者躁動、不配合或建立周邊血管路徑有染汙疑慮時，應避
免施打。 
 
註 7： 
  若懷疑為口服毒藥物中毒，且發生在 1 小時內，建議以左側躺姿勢後送。 
 
註 8： 
  除常規車內照護外，還須注意以下事項： 
一、  救護車勿開啟室內循環。 
二、  應打開救護車窗戶保持通風。 
120

三、  小心處理傷病患嘔吐物，避免二次污染。 
四、  可使用生理食鹽水或清水持續清洗皮膚直至醫院。

桃園市政府緊急傷病患救護作業程序手冊 
註 1： 
一、 產兆包括：規則陣痛（每次間隔小於 3-5 分鐘）、破水或落紅。 
二、 評估產兆同時由副手詢問以下事項： 
(一) 產婦年齡？ 
(二) 詢問預產期何時或懷孕第幾週？ 
(三) 第幾胎（第幾次生產）？ 
(四) 懷孕胎數（一胎或多胞胎等）？   
(五) 詢問產婦有什麼過去病史？ 
1.  胎位不正：胎頭無法順利娩出的風險較高。 
2.  前置胎盤：胎盤緊鄰或覆蓋子宮頸口，產前及產後大出血機率高。 
3.  植入性胎盤：胎盤緊密附著子宮肌肉，無法順利剝離娩出。 
4.  妊娠糖尿病：胎兒存在較高可能性為巨嬰，易發生肩難產。 
5.  子癲前症：增加胎盤早期剝離風險，嚴重會產前大出血；應隨時
注意產婦血壓及神經學症狀，做好子癲症發生的防範。 
三、  孕婦若懷孕 20 週以上及分娩後，要留意有慢性高血壓、子癇前症/
子癇症、妊娠高血壓及糖尿病的病史。 
 
註 2： 
  異常生產包括臍帶脫出或非正常位生產（如肩難產或臀位產等）；如有
臍帶脫出情形，建議可採膝胸臥式，使臀部高於胸部，減少臍帶壓力。 
 
註 3： 
一、  請產婦長哈氣勿憋氣，也不要任意用力，待準備好子宮收縮時，再
同步用力。 
二、  協助產婦調整姿勢為平躺、兩膝彎曲（將膝蓋靠向胸部 ） ，兩大腿
打開，並協助維護隱私。 
三、  打開生產包，並以無菌技術戴上無菌手套，將無菌治療巾墊於產婦
臀部下方，並準備好後續接生器械與布巾。 
123 
桃園市政府緊急傷病患救護作業程序手冊 
四、  一手護住胎頭，一手保護會陰，胎頭產出後檢查有無臍帶繞頸（若
有則排除），支持胎兒頭頸部並順勢旋轉，先牽引向下使上方肩膀
露出，再牽引向上使下方肩膀娩出。 
五、  新生兒產出後請參考「新生兒救護流程」。 
六、  如胎兒情況良好，產出 30 秒後以 2 個臍帶夾（或止血鉗）夾 2 處
臍帶，第一處離胎兒肚臍 5 至 10 公分，第二處離第一處 5 至 10
公分，完成後將胎兒交給母親，讓母親抱著；原則上僅將臍帶夾住，
但不斷臍。惟遇下列情況則須斷臍，並於救護紀錄表註記斷臍時
間： 
(一)  臍帶繞頸，且無法以手解除時。 
(二)  新生兒須進行需進行急救時。 
(三)  阻礙運送時。 
七、  產婦及新生兒均須填寫救護紀錄表，其中新生兒姓名以○○○（產婦
姓名）之子或女註記。 
 
註 4： 
  若有產後大出血的情形發生（定義為產後 24 小時內大出血超過 500 ml），
應檢視外陰部撕裂傷，必要時協助進行加壓止血；若疑似為子宮收縮不良所
造成，且已出現休克徵象時，可建立周邊血管路徑後給予生理食鹽水，並依
創傷六「創傷出血性休克救護流程」考慮 Transamine 注射。 
 
註 5： 
  儘量以搬運設備協助產婦上擔架床，避免用力與自行行走，而於移動過
程中造成危險。

三、  懷孕之特殊危急狀況 
(一)  妊娠意識不清：可能為子癲症、腦出血、癲癇發作或藥物中毒

(二)  妊娠呼吸衰竭：可能為羊水栓塞、心臟衰竭、先天性心臟病或

註 1： 
  急產接生後或胎兒已產出時，尚有臍帶之新生兒適用本流程。 
 
註 2： 
一、  新生兒有下列狀況之一即為不穩定： 
（一）  非足月產（37 週以下）。 
（二）  無呼吸或哭鬧。 
（三）  無良好肌張力。 
二、  若無法從母親得知新生兒是否足月，可藉由新生兒外觀手腳掌出現
掌紋、體毛以及外耳成型皺褶來判定足月。 
三、  肌張力的判定可溫柔地將新生兒手舉高後放開，若馬上縮回或揮舞
為正常的肌張力，若直接落下不動為無良好肌張力。 
四、  不穩定的新生兒可能需要急救，宜請求後續車輛支援。 
 
註 3： 
一、  如胎兒狀況良好，在產出 30 秒至 60 秒才鉗夾臍帶。 
二、  常規照護的保暖可由母親懷裡抱著，進行皮膚接觸維持新生兒體
溫。 
三、  對於呼吸正常的新生兒，不建議常規抽吸口鼻，避免刺激迷走神經
而造成心搏過緩。 
 
註 4： 
一、  擺位可將捲好的毛巾、摺疊好的條狀三角巾或多塊堆疊的乾淨紗布
墊置在新生兒肩膀下方，使其頭部輕微伸展來維持呼吸道暢通。 
二、  刺激可摩擦新生兒背部或輕彈腳底板。 
三、  抽吸時先抽口再抽鼻。 
 
 
130 
桃園市政府緊急傷病患救護作業程序手冊 
註 5： 
新生兒心率評估方式有下列三種: 
一、  評估臍動脈次數不超過 10 秒鐘。 
二、  若有 3 導程心電圖設備，建議在確認臍動脈後接上 3 導程心電圖監
測心跳。 
 
註 6： 
一、  若因臍帶影響急救時，得以無菌技術剪斷。 
二、  由於生產過程極易造成新生兒缺氧，因此建議心跳小於 100 下/分
的新生兒於出生後 1 分鐘內，立即給予正壓通氣，此即「黃金 1
分鐘」。 
三、  使用甦醒球人工呼吸時，35 週（含）以上新生兒應使用正常空氣
（room air）；35  週以下之早產兒則建議使用 21%-30%之氧氣（將
流速開至 1-3 L/min）。 
四、  新生兒人工呼吸為 1 秒鐘給一口氣。 
五、  新生兒人工呼吸給氣時應注意避免太大力過量，若有監測設備，其
初始通氣壓力為 20-25 cmH2O，足月產新生兒上限為 40 cmH2O，
早產兒則為 30 cmH2O，如果無法監測通氣壓力，則應該使用能讓
心跳加快的最低壓力，以防新生兒氣胸。 
六、  第一次人工呼吸 15 秒內須注意是否胸部有無起伏或心跳無上升，
則依下列步驟執行通氣校正（口訣：擺、吸、漏、壓）：   
(一)  擺：重新擺位並打開呼吸道。 
(二)  吸：給予抽吸。 
(三)  漏：吹氣時檢查面罩是否漏氣。 
(四)  壓：甦醒球吹大力一些，但避免超出通氣上限。 
七、  若 15 秒內有起伏或心跳有上升，直接完成 30 秒人工呼吸；若無起
伏，經通氣校正完畢後，再進行 30 秒人工呼吸。 
 
131 
桃園市政府緊急傷病患救護作業程序手冊 
註 7： 
一、  CPR 時氧氣流速為 15L/min（與人工呼吸不同）。

ROSC 時間。 
 
註 2： 
一、  給予氧氣： 
(一) 若已置入聲門上呼吸道或氣管內管：接上甦醒球給予 100％氧氣
治療，維持患者 SpO 2 於 92%至 98%間。 
(二) 若尚未置入聲門上呼吸道或氣管內管：給予非再吸入型氧氣面罩，
維持患者 SpO 2 於 92%至 98%間。 
二、  若患者對於聲門上呼吸道出現喉頭（嘔吐）反射，建議移除使減少
其躁動情形；氣管內管則不移除，以避免患者吸入性嗆傷。 
 
註 3： 
一、  以每 6 秒鐘一口氣方式給予人工呼吸，2 分鐘後再次評估患者有無
適當呼吸及頸動脈搏；若仍無適當呼吸，持續給予人工呼吸，若無
頸動脈搏，則立即開始 CPR。 
二、  給予人工呼吸時注意避免過度換氣，維持患者 SpO 2 於 92%至 98%
間。 
三、  人工呼吸速度建議可使用節拍器輔助，或配合 AED 節律聲每 10
下給一口氣。 
四、  若已置入氣管內管或聲門上呼吸道，建議接上 EtCO 2 監控，ROSC
患者數值應為 35-45 mmHg，若數值在 35 mmHg 以下，請重新確
認脈搏；若頸動脈摸得到，續依「DOPE」口訣多重確認氣管內管
或聲門上呼吸道位置： 
（一）  D（Displacement）：氣管內管或聲門上呼吸道是否發生位移？

（二）  O（Obstruction）：以甦醒球確認氣管內管或聲門上呼吸道是否
發生堵塞？ 
（三）  P（Pneumothorax）：患者是否發生氣胸？ 
（四）  E（Equipment failure）：是否為儀器問題？

一、  重新量測生命徵象並給予必要處置，建議血壓目標值維持在收縮壓

桃園市政府緊急傷病患救護作業程序手冊 
特殊十三「現場死亡處置原則」 
一、  相關規定 
  依行政院衛生署「緊急醫療救護諮詢委員會」第七次會議紀錄
決議，現場死亡之定義為「人體達到屍腐、屍僵、屍體焦黑、無首、
內臟外溢或軀幹斷體的狀態之一者，且無意識、無呼吸、無脈搏之情
形稱之」。 
 
二、  處理原則 
(一)  救護人員判定病患為現場死亡後，應回報救災救護指揮中心通知轄
區警察到達現場。 
(二)  救護人員或其家屬若對「現場死亡」有疑義時，應立即施行緊急救
護並儘速送醫。 
(三)  救護紀錄表中應載明患者係屬何種狀態而被認定現場死亡。 
 
三、  注意事項 
(一)  前述現場死亡定義中之情形必須於常溫狀態下，若為低體溫病患（量
測體溫為 32℃以下）或無法排除低體溫致死原因應立即加以救治，
並給予回溫處置。 
(二)  「常溫下，屍體僵硬」是指病患處於常溫（室溫）狀況下，牙關及
四肢關節僵硬，無法彎曲或伸直。   
(三)  急救時仍應保持現場完整性，尤其是可能涉及刑事案件之病患急救，
可於急救前使用密錄器或手機清楚拍攝，儘可能記錄事發現場原貌。
例如疑似上吊自殺案，病患如不符現場死亡條件時，應立即剪下繩
圈，留下繩結，將病患移至安全處施行心肺復甦術。繩結交給警察
機關，判定是否為自殺或他殺。   
151 
桃園市政府緊急傷病患救護作業程序手冊 
特殊十四「拒絕救護處置/拒絕送醫處理原則」 
一、  相關規定 
依緊急救護辦法第7條：「救護人員實施緊急救護時，如緊急傷病
患或其家屬拒絕接受運送，應要求其於救護紀錄表中簽名後，不予運
送」。 
 
二、  處理原則及注意事項 
(一)  對於有送醫必要傷病患拒絕處置或拒絕送醫者，救護人員應詳為解
說其傷況病情及可能發生之結果，並探詢其原因。 
(二)  有關解釋及說明部分，請告知傷病患： 
1.  「您的傷病況，應詳加評估與送醫。」 
2.  「您的傷病況，我們可以幫您初步處置。之後我們會將您轉送醫
院，由醫師幫您做詳細的評估與治療。」 
3.  「您的傷病況，可能比您想像的還要嚴重。拒絕治療或延遲治療，
可能使病況惡化。」 
(三)  傷病患如果堅持拒絕救護處置、拒絕送醫，救護人員應請傷病患（或
其家屬）於救護記錄表內簽名，完成其生命徵象測量並詳實記錄於
救護紀錄表生命徵象第一欄位中，惟如患者情緒不穩定時（精神疾
病或酒醉），救護人員無法接近時，得不測量。 
(四)  應向救災救護指揮中心報告現場情況後，始離開救護現場。

一、  精準的直接加壓： 
需暴露後找到確切出血點後進行，若無長期服用抗凝血藥物
（如部分 NSAIDs 止痛藥）藥物史或凝血因子異常病史，但加壓
10-15 分鐘卻止血無效時，應先移除敷料，以生理食鹽水（或乾淨

血處，再重新進行直接加壓。避免持續覆蓋敷料和加壓在非真正出

二、  加壓繃帶： 
以彈性繃帶或商品化加壓繃帶（如以色列加壓繃帶）進行出血處環
狀直接加壓止血，由於壓力大多會截住靜脈血流但無截住動脈血流
（與止血帶不同），若繃帶外不再滲血，可儘早（15-30 分鐘）換
成一般彈繃包紮的鬆緊度，避免加速腔室症候群產生。 
三、  填塞加壓止血： 
（一） 若無傷口專用填塞紗布或專用填塞紗布現場用罄，可以選擇紗布

繃帶或乾淨布料執行。 
（二） 需留意不可於軀幹（胸腔及腹腔）部位進行填塞，若於頸部靠近
氣管處須小心填塞，監控並維持呼吸道的通暢。 
四、  止血帶使用： 
（一） 以商品化專用止血帶為優先，不建議現場急造止血帶，除非現場
專用止血帶不足，且現有材料足夠並有相當製作練習經驗。只要
現場無彈性之束緊物材料沒有辦法超過 2.5 公分（1 英吋），或旋
轉絞緊材料用手或腳就可以折斷踩斷，都不應花費時間製作急造
止血帶，儘速進行直接加壓跟填塞加壓。 
（二） 若運送時間預估超過 2 小時，止血帶使用位置優先選擇傷處往近
心端 5-8 公分，肢體最上端近軀幹處次之。 
（三） 若運送時間預估超過 2 小時，可於接近 2 小時時嘗試替換成其他
止血包紮方式，若嘗試旋轉鬆開時仍持續出血，則立刻轉緊並且
加快速度送醫。 
（四） 有下列情形時，不再執行移除止血帶： 
1.  進入第三、四級休克。 
2.  完全截肢。 
3.  無法確切觀察患者是否再次出血。 
4.  超過 6 小時無法移除止血帶。

註 6： 
當患者可能有創傷性腦部傷害（Traumatic Brain Injury，以下簡稱 TBI）
或顱內壓升高（Increased Intracranial Pressure，以下簡稱 IICP）時，依創傷
二「頭部外傷救護流程」執行相關處置外，另有下述野外作為： 
一、  TBI 野外判斷原則： 
（一） 現場曾失去意識。 
（二） 任何程度的失憶，可能伴隨失去方向感、或茫然迷惘。 
（三） 可能無法得知患者是否曾失去意識，因此以第 2 點為主要判斷原
156 
桃園市政府緊急傷病患救護作業程序手冊 
則；所有 TBI 皆需送醫，並依風險高低決定運送速度。 
二、  TBI 風險辨識及運送速度： 
（一） 低風險 TBI，可以採取對患者及救援人員風險較低的運送，如陪
同步行、背負： 
1.  患者原本是健康的，無任何神經系統相關疾病史。 
2.  事發後意識迅速回復，且精神狀態正常無變化。 
3.  只有當下事件的記憶喪失，其餘記憶皆正常。 
4.  神經學的感覺及運動功能檢查正常。 
（二） 高風險 TBI，預期顱內壓升高機會高，須採取速度較快的運送方
式，地形狀況不佳考慮直升機緊急後送： 
1.  出現顱內壓升高早期的症狀與徵象，如嚴重頭痛或持續嘔吐。 
2.  意識清醒但持續的精神狀態改變。 
3.  最近有腦部傷害（如之前有 TBI 病史，其腦震盪症候群是否已
完全消退）的病史。 
4.  顱骨骨折：耳漏鼻漏、浣熊眼、耳後瘀青。 
5.  高風險傷害機轉：高速高能撞擊，頭部安全護具毀損，有其他
嚴重傷害並存。 
6.  有常服用抗凝血藥物（如部分 NSAIDs 止痛藥）藥物史。 
三、  IICP 野外判斷原則及作為： 
（一） 早期症狀與徵象：意識清醒下的精神狀態改變、嚴重頭痛產生及
持續嘔吐。 
（二） 在野外需於早期即須嘗試直升機緊急運送，若進展到晚期時由於
距離時間過久，就醫可能無法逆轉。 
（三） 視情況採取復甦姿勢或側臥（頭部需保護並免下垂）進行嘔吐預
防及呼吸道暢通；情況許可下，每 2 小時翻身換邊，避免側臥處
長時間受壓迫。 
 
註 7：

桃園市政府緊急傷病患救護作業程序手冊 
當患者疑似癲癇發作時，依非創傷四「抽搐救護流程」執行相關處置外，
若有下列情形，優先考慮使用直昇機緊急後送： 
一、  因創傷或是環境因素（如冷、熱）造成。 
二、  持續的神經學檢測異常。 
三、  於野外第 1 次癲癇發作。 
四、  癲癇重積。 
五、  患者任何情況惡化。 
 
註 8： 
  當患者可能有頸脊椎傷害時，依通用三「創傷病患緊急救護現場流程」
執行相關處置外，另有下述野外作為： 
一、  現場地形若無法執行雙人脊椎限制翻身技術，可採取野外多人
L.M.E.（Lifts、Moves、Extrication）技巧；如現場只有 1 人能執行
翻身時，可採取野外單人脊椎傷害患者翻身技巧進行翻身。 
二、  有脊椎傷害機轉且頭頸部未位於正中軸線患者，若無呼吸，有可能
同時有氣管扭結，以脊椎限制技術先移後轉，嘗試解除扭結狀態後
再次評估呼吸道有無暢通。 
三、  若患者仍有呼吸及脈搏，且環境非處高風險，可於脊椎檢測後再決
定是否採取脊椎限制翻身；如可排除脊椎傷害，則採用一般更換姿
勢翻身，以減少移動脊椎次數。 
四、  脊椎檢測： 
相較於都市到院前脊椎檢測是儘可能的保護脊椎傷害，後送至
醫院後再採用儀器和更詳細的神經學檢查來排除，野外地區則因為
若檢測患者有脊椎傷害的可能，則患者必須長時間全身被固定限制
住，在搬運途中對於救援者及患者風險都將提高，並且長時間背部
壓迫容易缺血造成壓瘡傷害。 
WMAI（Wilderness Medical Associates International，國際野外
醫療協會）所訂的「野外脊椎檢查準則」，適用於野外及長時間運
158 
桃園市政府緊急傷病患救護作業程序手冊 
送前，排除沒有脊椎傷害患者，以採取低風險運送方式，其準則包
含 3 個部分： 
（一） 精神狀態，若無法排除下列情形，成為可信賴的患者，則無法通
過脊椎檢查： 
1.  意識清醒：有脊椎傷害機轉的患者接受檢測時意識狀態必須是
警醒的。 
2.  沒有 ASR：清醒的患者要先安撫及排除急性壓力反應（ASR）
的影響。 
3.  沒有分心傷害：傷勢的疼痛有可能造成檢測失準，要先初步處
理疼痛可能會影響的傷害，讓患者能注意在脊椎的檢測後，再
進入脊椎理學檢查。 
4.  沒有毒素影響：毒素（包含酒精）會影響脊椎檢測準確性，但
若是能配合者（如承認飲酒但對答及反應皆正常）可以繼續執
行。 
5.  有 TBI 但精神狀態良好：TBI 患者可以進行檢測，但持續精神
狀態變差，則檢測會失準。 
（二） 有新症狀，是否是因本次事件傷害後造成，排除舊疾以及可能是
四肢傷勢造成的影響；若確定為新發生的症狀，則無法通過脊椎
檢查： 
1.  頸部、背後的疼痛。 
2.  四肢的麻木刺痛無力。 
3.  大小便失禁。 
（三） 理學檢查，分為脊柱與脊髓的檢查： 
1.  脊柱：從頸椎第 1 節到脊椎最後 1 節觸診是否壓痛、變形，需
區分疼痛來自脊椎還是旁邊肌肉。 
2.  脊髓：神經學的運動Ú感覺測試，測試脊神經高位 C7ÚC8ÚT1，低
位 L5ÚS1。 
(1) 運動： 
159 
桃園市政府緊急傷病患救護作業程序手冊 
a.  手部：分開測試手指外展（將患者食指至小指內壓併攏）或
手指上頂（扶助患者手腕，將患者整片手指下壓）有無抵抗
力量。 
b.  腳部：分開腳掌下壓和回勾有無抵抗力量。 
(2) 感覺： 
a.  削尖沖洗棉棒的一端（尖度測試自己會感覺刺痛），使用尖端
及棉花端（鈍端）進行測試；先在患者額頭做頭皮感覺基準
點測試，確認尖/鈍（針/輕，即以尖端輕刺、鈍端輕撫）的
觸覺，並請其閉眼。 
b.  手部：分別測試雙手尺骨端小指外緣尖/鈍（針/輕）觸覺分
辨；當肢體末端有傷口時，可往近心端測試，但最高測試處
不超過手腕。 
c.  腳部：分別測試雙腳腳背板外緣的尖/鈍（針/輕）觸覺分辨；
當肢體末端有傷口時，可往近心端測試，但最高測試處不超
過小腿下 1/3 處。 
d.  另若擔心患者是以猜測作答，可重覆進行感覺測試。 
e.  斷肢傷害當下無法通過測試，若患者後期已可將注意力集中
時，則繼續進行檢測。 
（四） 脊椎檢查通過條件： 
1.  正常的精神狀態：患者可信賴。 
2.  頸部、脊椎沒有新的疼痛、四肢沒有刺痛、麻木感或肌肉無力、
大小便失禁。 
3.  脊椎觸診沒有壓痛。 
4.  運動及感覺神經學檢查正常。 
五、  低風險脊椎傷害: 
（一） 正常的精神狀態：患者可信賴。 
（二） 可忍受的疼痛和壓痛，能夠移動和支撐重量。 
（三） 四肢沒有刺痛、麻木感或肌肉無力、大小便失禁。 
160 
桃園市政府緊急傷病患救護作業程序手冊 
（四） 運動和感覺神經學檢查正常 
（五） 若後送路線搬運有困難時，可協助患者緩慢步行移動至道路接
駁。 
六、  高風險脊椎傷害: 
（一） 傷患有明顯的脊椎傷害機轉，但不可信賴。 
（二） 無法忍受的疼痛及壓痛，無法輕易的移動和承受重量。 
（三） 新出現的刺痛感、麻木感、肌肉無力、大小便失禁。 
（四） 運動及感覺神經學檢查異常。 
（五） 高風險脊椎傷害，以籃式擔架、SKED 包裹（須注意勿擠壓患肢
導致腔室症候群），患者與擔架空隙需填滿，底部需柔軟襯墊，
骨突摩擦處須保護，搭配山域救援專用全身抽氣式護木更為理
想。 
（六） 如果有持續神經學的缺損，優先考慮使用直昇機緊急後送。 
（七） 若運送途中，有解開包裹固定的必要時（否則將影響患者生存），，
則應解開其束縛固定。 
七、  其他注意事項： 
（一） 通過脊椎檢查的患者，後續可能因為肌肉傷害的腫脹及痙攣，之
後出現脊椎或頸部疼痛，此時不需要改變原本評估或進行特別保
護。 
（二） 四肢末梢的麻木或刺痛感可能是肢體個別傷害所導致，若其他脊
椎檢查均能夠執行且正常，依然可視為脊椎傷害排除。 
（三） 若環境狀況（如雪地）或傷情無法將鞋子脫除，在進行尖銳/鈍
的感覺測試時，可在腳踝以上的裸露皮膚進行測試（惟不可在衣
物上做測試）。 
八、  頸椎固定： 
（一） 長時間頸圈固定對其呼吸及循環都有不良影響，建議可改採用柔
軟衣物布料填塞頸部、頭部或是抽氣式頸圈，避免使用不可調整
且邊緣硬薄的軟式護木做替代頸圈。 
161 
桃園市政府緊急傷病患救護作業程序手冊 
（二） 如為單獨的腰椎或骨盆壓痛，但是神經學檢查正常，則不需要做
頸椎的保護。 
 
 
註 9： 
當患者可能有不穩定肌肉骨骼傷害（含骨盆）時，依創傷五「肢體外傷
救護流程」執行相關處置外，另有下述野外作為： 
一、 不論遠端脈搏、感覺及運動功能是否受損，長骨都進行牽引復位後
固定，若復位時嚴重疼痛且有阻力則停止復位。 
二、 關節受傷時，以原姿勢固定，但若遠端脈搏、感覺及運動功能受損，
需復位再進行固定，通常在其原活動範圍中段可回復遠端脈搏、感
覺及運動功能，若復位時嚴重疼痛且有阻力則停止復位。 
三、 使用抽氣式護木以外的其他固定方式時，固定物與肢體皮膚、骨突
摩擦處須放置襯墊；固定綑綁以分段為主，減少纏繞，以方便運送
途中過緊或過鬆之分段調整。 
四、 腿部長時間固定，膝窩下可微屈放置襯墊，避免過長時間維持僵直
姿勢。 
五、 後送過程中，隨時注意遠端脈搏、感覺及運動功能。 
六、 若患者骨盆不穩固，優先使用骨盆固定帶；如無骨盆固定帶時，可
使用天幕外帳或大張無彈性布巾旋轉對側拉緊後，搭配集線束帶綑
綁，或是登山背包之腰帶代替。 
七、 股骨不穩定傷害固定及運送時，可考慮使用全身抽氣式護木或大腿
長度之抽氣式護木時，可於包覆後抽氣前將患者兩腳屈膝，小腿往
遠心端牽引再抽氣塑形，利用小腿下沉重量幫助股骨牽引。 
 
註 10： 
當患者因垂直懸吊而長時間直立時，考慮懸吊症候群的發生，其處置原
則及建議如下： 
162 
桃園市政府緊急傷病患救護作業程序手冊 
一、  血液可能因重力匯集於下肢，造成相對低血容而導致休克。 
二、  延遲性橫紋肌溶解症及腎功能衰竭可能在救援時或之後產生。 
三、  儘快脫困後使其仰躺，不再建議延遲脫困及緩慢移除吊帶。 
四、  若評估脫困釋放至地面的時間會過長，救援人員可於掛接救援時嘗
試運用岩壁或是扁帶環等救援器材讓患者腿部移動或抬高，幫助血
液回流。 
五、  脫困前儘早給予注射用生理食鹽水 IV 至少 1,500 ml/hr，避免使用
乳酸林格式液；脫困期間仍持續給予輸液。 
六、  脫困期間，如現場狀況允許，EMT-P 可考慮於輸液內給予 sodium 
bicarbonate 3 amp（50 meq/L，20 ml/amp，每支含 17 meq），以減
少患者發生腎衰竭，脫困後調整為 0.9%N/S 500 ml/hr 和 D5W 500 
ml/hr IV 交替給予。 
七、  若有心電圖監測設備時，可監測是否有高血鉀症狀出現（T 波高尖），
持續監測尿液尿量及顏色是否產生橫紋肌溶解。 
八、  患者若於脫困前後，曾出現過休克徵象，優先考慮直升機緊急後
送。 
 
註 11： 
野外地區的各種傷口處置原則及建議如下：   
一、  需後送至醫療機構的傷情： 
（一）  外觀或是功能上的受損：預期疤痕會影響外觀，或該部位功能可
能會受損。 
（二）  穿透筋膜。 
（三）  傷口導致呼吸窘迫、休克、TBI。 
（四）  受傷受汙染、粉碎、或壞死。 
（五）  開放性骨折。 
（六）  深層穿刺傷。 
（七）  具有動物唾液的咬傷。 
163 
桃園市政府緊急傷病患救護作業程序手冊 
二、  穿刺傷： 
利用三角巾、彈性繃帶固定穿刺異物，搬運時須注意撞擊，且
加速運送速度避免感染發生。 
三、  灼燙傷： 
除依特殊二「灼燙傷救護流程」處置外，遇有以下情況時優先
考慮直升機緊急後送： 
（一）  嚴重髒污、外觀或是功能上受損。 
（二）  環狀、三度、呼吸道、或化學灼燙傷 
（三）  大範圍灼燙傷（二度+三度灼燙傷體表面積大於 10％） 
四、  斷肢： 
（一） 處置依創傷五「肢體外傷救護流程」。 
（二） 無法取得冰塊或長時間冰敷袋之環境，若保存斷肢之內袋有可能
破裂的疑慮時，考慮改用浸濕之毛巾、頭巾、衣物等包覆；避免
外袋只裝水，因為內袋破裂時，水可能流入而直接浸泡斷肢。 
（三） 優先考慮直升機緊急後送。 
五、  傷口感染： 
（一） 當傷口發生發紅、疼痛、發熱、腫脹的狀況或產生膿瘡、膿液流
出時，可能已有局部感染情形（有些細菌最快會在 6 小時內產生
感染）；沖洗並覆蓋敷料，可以的話要讓分泌物引流，並給予一
天 4 次的熱敷。 
（二） 已出現感染症狀患者，合併發燒、意識不清、倦怠等情形，需留
意是否已進入敗血性休克，視情況給予高濃度氧氣（必要時正壓
給氧），靜脈輸液，並優先考慮直升機緊急後送。 
               
註 12： 
野外地區的熱急症處置原則及建議如下： 
一、  目標是在 30 分鐘內將患者快速冷卻至 39℃。 
（一）  各種從 42℃降至 39℃的降溫方法所需時間參考： 
164 
桃園市政府緊急傷病患救護作業程序手冊 
1.  冰浴（2°C）：9.5 分鐘。 
2.  冷水浸泡：12 分鐘。 
3.  半身浸泡在 1.3°C 的水中：15 分鐘。 
4.  浸泡在 14°C 的冷水中：17 分鐘。 
5.  水沾溼紗布及搧風：30 分鐘。 
6.  水加搧風：83 分鐘。 
（二） 野外無池塘溪流或水源稀少處，可用防水天幕外帳將人放入對折，
維持呼吸道暢通，倒入水淹過患者身體進行冰浴或冷水浸泡。 
二、  給予 IV 或口服水份（意識清醒時）以維持正常的排尿量；在患者
可以進食狀況下，給予食物能量補充。 
三、  避免再次受到熱傷害，即使處置後改善也需後送。 
四、  若精神狀態或排尿量異常優先考慮直升機緊急後送。 
 
註 13： 
野外地區的冷急症處置原則及建議如下： 
一、 由於攜帶式體溫計限制，野外現場只分為輕微失溫（32°C -35°C）
及嚴重失溫（小於 32°C）。 
（一） 輕微失溫：意識清醒，但精神狀態差，發抖。 
（二） 嚴重失溫：意識不清醒（聲、痛、否），停止顫抖，可能測不到
生命徵象。 
二、 輕微失溫現場處置： 
（一） 體外回溫：保持患者衣物及皮膚乾燥，降低蒸發作用，保暖層內
避免燙到的情況下，中心軀幹放置低溫暖暖包或裝熱水之耐熱塑
膠水壺增加溫度。 
（二） 體內回溫：給予食物與熱水補充能量熱量、水份（優先考慮含糖
份熱飲），勿飲用含咖啡因飲料或酒精類。 
（三） 運用羽絨、化纖等材質衣物或睡袋留住發抖所產生的體溫，並使
用防水材質或是鋁箔類材質包裹，隔離對流、傳導、輻射作用。 
165 
桃園市政府緊急傷病患救護作業程序手冊 
三、 嚴重失溫現場處置： 
（一） 以外在的熱源進行失溫包裹，進行現地回溫。可使用睡袋、睡墊、
防水天幕外帳或大片鋁箔求生毯。 
（二）  讓身體保持水平姿勢，輕柔但緊急運送。   
（三） 若有 IV，給予溫暖輸液，若無，考慮於中心軀幹放置低溫暖暖
包或裝熱水之耐熱塑膠水壺增加溫度。 
（四）  嚴重失溫需考慮用直升機緊急後送，即使回溫也需後送。 
 
註 14： 
高海拔疾病（急性高山症、高海拔腦水腫、高海拔肺水腫）好發於海拔
2,500 公尺以上，但也可能於海拔 2,000 公尺發生，其處置原則及建議如下： 
一、  急性高山症（Acute Mountain Sickness，簡稱 AMS） 
（一） 血氧濃度數值對診斷急性高山症無太大幫助，但可以藉由數值趨
勢協助了解充氧是否改善或惡化，須特別注意高海拔環境陽光、
溫度、氣壓等等對血氧濃度偵測和機器本身的影響。 
（二） 雖然症狀可在海拔升高後 6 小時內出現，但建議 6 小時後再評估
急性高山症分級，避免與其他症狀或對急性缺氧的反應（例如迷
走神經反應）混淆。 
（三） 2018 路易斯湖急性高山症評分： 
1.  依「頭痛」、「胃腸道」、「疲倦Ú虛弱」、「頭暈Ú頭昏目眩」計 4 項
評分總和，其中頭痛評分必須至少為 1 分。惟當總分大於 2 分但
沒有頭痛時，不代表可以排除急性高山症正在發生；而當頭痛得
分 3 分，沒有其他症狀，視為急性高山症。 
2.  各項評估內容及評分：

3.  依評分總和可將急性高山症分為 3 級： 
(1) 輕度：總和 3-5 分。 
(2) 中度：總和 6-9 分。 
(3) 重度：總和 10-12 分。 
（四） 輕度急性高山症處置： 
1.  停止上升高度。 
2.  鼻管給氧 1-2 L/min，嘗試維持血氧≧90%。 
（五） 中、重度急性高山症處置： 
1.  重度急性高山症且合併神經學症狀時，視為高海拔腦水腫 
2.  下降高度 500-1,000 公尺。 
3.  鼻管給氧 1-2 L/min，嘗試維持血氧≧90%。 
二、  高海拔腦水腫（High-Altitude Cerebral Edema，簡稱 HACE） 
（一） 症狀與徵象： 
1.  輕度高海拔腦水腫：重度急性高山症且合併神經學症狀。 
2.  中度高海拔腦水腫：IICP 早期症狀與徵象（意識清醒下的精神
狀態改變、嚴重頭痛產生及持續嘔吐）。 
3.  嚴重高海拔腦水腫：IICP 晚期。 
（二） 高海拔腦水腫處置： 
1.  立刻下降高度 1,000 公尺以上。 
2.  鼻管給氧 2-4 L/min，嘗試維持血氧≧90%；若無法提升血氧值
時，更換給氧方式、增加氧氣濃度和流速。 
三、  高海拔肺水腫（High-Altitude Pulmonary Edema，簡稱 HAPE） 
（一） 症狀與徵象： 
1.  輕微高海拔肺水腫：運動表現下降，乾咳，運動時輕度呼吸窘迫
（不一定全部出現）。 
167 
桃園市政府緊急傷病患救護作業程序手冊 
2.  中度高海拔肺水腫：患者會持續咳嗽，聽診時可能出現濕囉音
（crackles），中心型發紺，血氧與之前相比降低，休息時呼吸窘
迫，輕微發燒（不一定全部出現）。 
3.  嚴重高海拔肺水腫：呼吸衰竭，多痰（粉紅色泡沫或帶血絲），
濕囉音可直接從口中聽得見。 
（二） 高海拔肺水腫處置： 
1.  立刻下降高度 500-1,000 公尺。 
2.  起始給氧 4-6 L/min，嘗試維持血氧≧90%；若無法提升血氧值
時，更換給氧方式、增加氧氣濃度和流速，必要時使用 BVM。 
 
註 15： 
野外地區的雷擊處置原則及建議如下： 
一、  被雷擊者本身不帶電，但須迅速帶其及整個救援團隊離開落雷區再
進行急救。 
二、  若雷擊造成多人或大量傷患，則進行逆向檢傷，即優先急救黑色患
者（無意識、呼吸及脈搏）。 
 
註 16： 
野外地區的蛇咬傷處置原則及建議如下： 
一、  一律視為高風險傷口，並且優先考慮直升機緊急後送。 
二、  若確定蛇種，前往具該類抗蛇毒血清之醫院；不確定者，根據傷口
是否持續出血、腫脹、血泡、瘀傷，或是是否有神經學狀態異常或
呼吸窘迫、呼吸衰竭初判是神經性毒或是出血性毒。 
三、  患者若有拍照到蛇，可將照片傳給後送醫院。 
四、  移除咬傷肢體所有束縛物和飾品。 
五、  將腫脹區域外圍用奇異筆畫圈，並註記日期時間，每 15 分鐘做新
標記，以持續觀察腫脹範圍；若無腫脹，疼痛或壓痛處外圍也需要
圈起註記範圍。 
168 
桃園市政府緊急傷病患救護作業程序手冊 
六、  肢體保持與心臟同高或略低，不要抬高或垂墜。 
七、  不要使用止血帶，不要冰敷，不要割開傷口，不要用嘴吸吮傷口毒
液，也不要使用毒液吸取器。 
八、  可以給予生理食鹽水靜脈輸注，若血氧降低給予氧氣處置。 
九、  以擔架運送為優先考量，但可以視人力和路況採背負方式，當患者
可以行走時，也可以讓其步行前往救援會合。 
十、  若無明顯腫脹持續或是確定是神經性蛇毒，可以紗布覆蓋傷口，使
用彈繃遠心端向近心端包紮需覆蓋傷口兩端超過 10-15 公分，並加
上夾板固定患肢避免移動，隨時檢查患肢遠端脈搏、感覺及運動功
能。 
十一、 使用彈繃時的力道跟一般包紮一樣即可，用意在壓縮毒液在淋巴管
和微血管，避免進入大循環。 
 
註 17： 
野外地區的常見疾病（眼耳鼻喉Ú胸部Ú腹部Ú腸胃道Ú泌尿生殖）處置原則
及建議如下： 
一、  眼睛： 
（一） 使用護目鏡或硬式眼罩保護受傷眼睛。 
（二） 給予生理食鹽水沖洗濕潤。 
（三） 有下列情形時，優先考慮直升機緊急後送： 
1.  視力受損。 
2.  兩眼眼外肌運動不協調（正常為兩眼上下左右同步）。 
3.  瞳孔不等大。 
4.  眼前房出血（虹膜底部一層棕色或紅色積血）。 
5.  眼瞼嚴重腫脹。 
6.  異物穿刺。 
7.  合併嚴重頭痛。 
二、  鼻子： 
169 
桃園市政府緊急傷病患救護作業程序手冊 
（一） 捏住鼻翼直接加壓 10-15 分鐘。 
（二） 有下列情形時，優先考慮直升機緊急後送： 
1.  流鼻血和發燒、感染，或與頭部創傷有關。 
2.  持續且大量出血不止，經捏鼻翼直接加壓 10-15 分鐘無效。 
3.  鼻中隔血腫： 
(1)  鼻創傷後的鼻中膈血腫對鼻軟骨施加的壓力會造成缺血和梗
死，並導致以後的畸形。 
(2)  檢查時鼻孔內像顆小葡萄。 
三、  牙齒： 
（一） 牙齒掉落處置 
1.  從牙冠處拾起牙齒，避免觸碰牙根。 
2.  若有髒汙，用全脂牛奶、生理食鹽水、綠茶、患者口水、或乾
淨可以喝的水輕柔清洗牙根，不要去刷洗牙根。 
3.  意識清醒患者，儘快將掉落的牙齒放回原本牙槽，可用敷料讓
其咬住避免牙齒脫落。 
4.  意識不清患者，不要將牙齒放回牙槽，避免呼吸道阻塞風險；
儘快將掉落牙齒以全脂牛奶、生理食鹽水、口水、或綠茶浸泡
保存。若無上述液體，至少使用乾淨可以喝的水浸泡，避免牙
根開始變乾。 
5.  儘可能於 12 小時內以一般運送至牙醫專科就診。 
（二） 牙齦膿腫處置 
1.  腫脹於牙齦處可見時，嚴重臉頰、頸部或鼻竇也會腫脹。 
2.  牙齦感染膿腫預期會產生全身性感染，須隨時監測患者生命徵
象。 
3.  優先考慮直升機緊急後送。 
四、  喉部感染 
（一） 有下列情形時，採用一般運送： 
1.  呼吸順暢。 
170 
桃園市政府緊急傷病患救護作業程序手冊 
2.  可以飲食。 
3.  沒有發燒，或只是間歇性發燒。 
4.  喉部疼痛可以忍受。 
5.  狀況穩定或感覺好轉。 
6.  有伴隨其他上呼吸道感染症狀，如：懸雍垂腫脹，但不影響呼
吸道暢通。 
（二） 有下列情形時，優先考慮直升機緊急後送： 
1.  呼吸窘迫。 
2.  無法進食或喝水。 
3.  持續發燒。 
4.  持續嚴重疼痛，患者難以忍受。 
5.  咳血。 
6.  惡化。 
五、  呼吸系統感染 
（一） 處置： 
1.  患者意識清醒時，維持適當的飲水及熱量攝取。 
2.  若出現喘鳴音或呼吸窘迫的情形時，依非創傷二「呼吸困難救
護流程」執行。 
（二） 有下列情形時，優先考慮直升機緊急後送： 
1.  呼吸窘迫。 
2.  吞嚥分泌物明顯困難。 
3.  持續發燒。 
4.  痰液帶血。 
5.  心搏過速。 
6.  持續胸痛。   
六、  胸痛 
（一） 依非創傷七「疑似缺血性胸痛救護流程」和非創傷八「急性心臟
衰竭救護流程」進行。 
171 
桃園市政府緊急傷病患救護作業程序手冊 
（二） 有下列情形時，優先考慮直升機緊急後送： 
1.  出現「缺血性胸痛」或「急性心臟衰竭」症狀與徵象（見非創傷
七「疑似缺血性胸痛救護流程」及非創傷八「急性心臟衰竭救護
流程」）。 
2.  患者休息一段時間或是調整姿勢後，疼痛仍無法緩解。 
3.  非高風險傷口或無明顯外傷之胸部創傷，經處置後仍持續疼痛無
緩解。 
七、  腹痛、腹瀉、嘔吐 
（一） 患者持續嘔吐，考慮給予生理食鹽水靜脈輸液。 
（二） 有下列情形時，優先考慮直升機緊急後送： 
1.  持續嘔吐無法維持呼吸道暢通，或核心溫度持續下降。 
2.  出現休克的症狀與徵象。 
3.  持續發燒。 
4.  嘔吐物或腹瀉中帶血。 
5.  疼痛縮限於特定部位。 
6.  疼痛部位觸診壓痛或反彈痛，甚至疼痛加劇。 
7.  移動時疼痛加劇。   
八、  泌尿生殖系統 
（一） 口服或靜脈輸液補充水分。 
（二） 睪丸扭轉患者，嘗試將陰囊及睪丸提起將纏繞的精索解開。 
（三） 有下列情形時，優先考慮直升機緊急後送： 
1.  男性泌尿道感染。 
2.  扣診後背，腎臟處疼痛。 
3.  泌尿道感染且持續發燒。 
4.  泌尿道感染伴隨嚴重腹部疼痛。 
5.  泌尿道感染且患者已知有性傳染病。 
6.  出現血尿。 
7.  側腹痛輻射至單側鼠蹊部。 
172 
桃園市政府緊急傷病患救護作業程序手冊 
8.  無法排尿伴隨腹部疼痛，且現場無法進行導尿。 
9.  睪丸扭轉之男性，纏繞的精索無法解開。 
10.  陰道發炎合併有腹痛症狀。 
11.  陰道發炎但懷孕之女性。 
 
註 18： 
野外地區的冷傷害（如凍瘡、表淺層凍傷、深層凍傷或壕溝足等）處置
原則及建議如下：   
一、  凍瘡及表淺層凍傷： 
（一） 軟、蒼白、冰冷、麻木，只有表皮層凍傷，皮下組織可以自由
移動。 
（二） 處置：立即現地回溫，防止再次凍傷，保持水泡完整，防止患
處受到二次傷害。 
二、  深度凍傷： 
（一） 硬、蒼白、冰冷、麻木，沒有感覺，凍傷深到皮下組織，凍傷
範圍的關節無法正常動作。 
（二） 處置： 
1.  優先考慮運送至回溫可嚴密監控的醫療機構，可選擇燒燙傷中
心或是可執行血栓溶解術的醫療機構。 
2.  若可以在 24 小時內後送至醫療機構，不做現地回溫。 
3.  運送時須保護患者及其患處，避免更進一步凍傷。 
4.  深度凍傷患者可以用凍傷的腳移動或是滑雪撤退（尚穿著保護
護具時），但腳部若已經回溫，就必需要使用擔架搬運或是直升
機運送。 
（三） 深度凍傷現地回溫條件： 
1.  24 小時內無法後送至醫療機構。 
2.  患者目前的起居活動不需要再用到凍傷的肢體。 
3.  若再次凍傷是可以避免的。 
173 
桃園市政府緊急傷病患救護作業程序手冊 
4.  現場有可煮水且能保持溫度的設備。 
（四） 現地回溫的方式： 
（五） 若無禁忌症（如過敏史），EMT-P 可給予患者口服 ibuprofen 600 
mg，一天 2 次。 
（六） 在 37–39°C 的水裡（或以手測量感覺溫暖卻不燙手的溫度）快
速回溫，直到患處溫暖柔軟。 
（七） 使用無菌敷料、繃帶及護木包紮固定並保暖。 
（八） 避免讓患處受傷及再次凍傷。 
（九） 使用擔架搬運或是直升機運送。 
三、  壕溝足： 
（一） 保持患者足部乾燥與溫暖、維持血液灌流。 
（二） 患肢保持乾淨，如果有感染根據局部感染處置原則執行。 
（三） 運送時若患者疼痛不適，在無禁忌症（如過敏史）的情況下，
EMT-P 可給予患者口服 ibuprofen 600 mg。 
（四） 注意「雷諾現象（Raynaud Phenomenon）」： 
1.  雷諾現象是一種對寒冷或情緒壓力明顯的血管過度反應。 
2.  肢體末梢遇冷時血管不正常收縮缺血發紺，變成界線分明的白
色、藍紫色分界，嚴重時甚至會造成組織壞疽，最後導致截肢。 
3.  患肢保暖，避免患者患肢繼續接觸冷緣，運送。 
 
註 19： 
潛水傷害（如地下施工區域掉落地下水域或海岸區域落海傷害等）處置
原則及建議如下： 
一、 肺超壓力（肺部過度壓力）症候群或爆肺症候群（Pulmonary 
Overpressure Syndromes，POPS）： 
（一） 機轉：無法控制上升速度，導致從深處上升太快，氣體於水下
爆炸，造成肺部過度擴張及破裂，最嚴重產生動脈氣體栓塞。 
（二） 徵象及症狀： 
174

1.  過度擴張伴隨局部傷害（最輕微）：聽診呼吸音減弱、咳血。 
2.  縱膈氣腫（最常見）：聽診呼吸音減弱、聲音沙啞、頸部腫脹、
輕微胸骨處疼痛；隨著呼吸和咳嗽可能加重程度、嚴重會胸痛、
呼吸窘迫、吞嚥困難。 
3.  皮下氣腫：聽診呼吸音減弱、頸部和鎖骨區按壓有劈啪聲、聲
音沙啞、喉嚨疼痛、吞嚥困難。 
4.  氣胸（少數發生）：聽診呼吸音減弱、尖銳性胸痛、吸不到氣、
皮下氣腫、呼吸窘迫；嚴重時可能導致張力性氣胸。 
5.  動脈氣體栓塞（最嚴重）：可能浮出水面馬上就發生，視空氣進
入位置，可能產生心律不整、心臟停止、心肌梗塞、急性腦中
風等栓塞疾病症狀，患者只要是潛水浮出水面失去意識，除非
有其他確定病史，否則皆先懷疑動脈氣體栓塞。 
（三） 處置： 
1.  運送避免壓力變化，若直升機運送須貼海平面飛行（至少低於
300 m）。 
2.  過度擴張伴隨局部傷害：以患者舒適姿勢運送，鼻管給予氧氣
2-4 L/min。 
3.  縱膈氣腫、皮下氣腫:  仰躺或患者舒適姿勢運送，鼻管給予氧
氣 2-4 L/min。 
4.  氣胸:  以患者舒適姿勢運送，鼻管給予氧氣 2-4 L/min。若進展
成為張力性氣胸，則依照救護作業程序流程創傷八「張力性氣
胸救護流程」處置。 
5.  動脈氣體栓塞: NRM 氧氣給予 12-15 L/min、IV 0.9 N/S 或 L/R
（不含葡萄糖之輸液）1-2 ml/kg/hr。 
6.  若發生癲癇，則依照救護作業程序流程非創傷四「抽搐救護流
程」處置。 
7.  採仰臥平躺姿勢即可，不需要頭低腳高（並不會阻止氮氣氣泡
進入循環），反而可能增加 IICP 導致腦水腫惡化。

8.  緊急運送至能夠執行高壓氧艙治療的醫療機構。 
二、 減壓病/潛水夫病（Decompression Sickness，DCS）： 
（一） 機轉：潛水員待在深水下停留時間過長且上升沒有足夠時間排出
氮氣。 
（二） 徵象及症狀： 
1.  皮膚、淋巴（不常見）：劇烈搔癢感、燒灼感、肩部與胸部以上
紅疹，色斑和大理石斑可能比搔癢燒灼感先出現；局部發紺和凹
陷性水腫。 
2.  肢體疼痛：一或多個關節或肢體部位有輕微或嚴重的深層疼痛感、
關節活動時有輾壓感、運動時更痛。 
3.  心肺窒息（最嚴重）：乾咳、胸骨下方疼痛、發紺、呼吸窘迫、
休克、心肺停止。 
4.  神經問題（嚴重）： 
(1) 腦部：多重視覺變化、頭痛、感覺困惑、失去定向力、噁心嘔
吐。 
(2) 脊髓：背痛、肢體沉重或無力、肢體麻木、癱瘓、尿液滯留或
失禁。 
(3) 內耳：眩暈、步態不穩。 
（三） 處置： 
1.  潛水後24小時內或潛水後48小時內進行飛行產生的任何疼痛或
神經學徵象或症狀，除非有其他確定病史，否則皆先懷疑 DCS。 
2.  皮膚、淋巴型態及肢體關節輕度疼痛陪同運送途中觀察 24 小時
有無惡化即可。 
3.  肢體中度疼痛以上、發紺、呼吸窘迫及神經問題：NRM 氧氣給
予 12-15 L/min、IV 0.9 N/S 或 L/R（不含葡萄糖之輸液）  1~2 
ml/kg/hr。 
4.   若發生癲癇，則依照救護作業程序流程非創傷四「抽搐救護流
程」處置。

5.  運送避免壓力變化，若直升機運送須貼海平面飛行（至少低於
300 m）。 
6.  運送時採仰臥姿勢。 
7.  肢體中度疼痛以上、發紺、呼吸窘迫及神經問題需緊急運送至能
夠執行高壓氧艙治療的醫療機構。 
三、 中耳或內耳壓力性損傷： 
（一） 徵象及症狀： 
1.  受傷的耳朵有飽脹感或堵塞感。 
2.  耳道有血液。 
3.  疼痛、眩暈、噁心、噁吐、蒼白、冒冷汗。 
4.   聽力喪失。 
5.  迷失方向、肌肉協調失去導致步態不穩。 
（二） 處置時注意事項： 
1.  避免劇烈活動和大音量噪音。 
2.  運送上半身保持直立或患者舒適姿勢，避免耳部壓力增加。 
3.  運送避免壓力變化，若直升機運送須貼海平面飛行。
